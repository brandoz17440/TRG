<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f4a2b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111410" media="(prefers-color-scheme: dark)">
<meta name="description" content="TRG selection training program: 10-day roster, day sheets, logs and progress. Your log stays on your device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRG Program">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>html,body{margin:0}</style>
<title>TRG Selection Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single phone column, sticky header, fixed bottom tab bar; field-kit olive for Phase A, steel blue for Phase B */
:root{
  --bg:#eceee6; --surface:#ffffff; --surface2:#f5f6f0; --ink:#1b1f16; --muted:#5b6253; --faint:#8a9180; --line:#d3d7c8;
  --olive:#3f4a2b; --olive-ink:#ffffff; --blue:#2c4a63; --blue-ink:#ffffff; --sand:#a8894a; --sandbg:#f2ecdc;
  --red:#8a2f22; --redbg:#f6e9e5; --good:#2f6b3a; --goodbg:#e4efe2; --bluebg:#e6edf3;
  --day:#f0e2b6; --arvo:#ecceb0; --night:#2c3a52; --night-ink:#ffffff; --off:#d7e5cd;
  --series:#3f4a2b; --grid:#e1e4d8; --focus:#8a6d2b;
  --k-str:#2a78d6; --k-run:#eb6834; --k-swim:#1baf7a; --k-pack:#eda100; --k-course:#e87ba4; --k-gpp:#008300; --k-test:#6250d6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111410; --surface:#1a1e17; --surface2:#20251c; --ink:#e6e9dd; --muted:#a2a995; --faint:#7c836f; --line:#343a2d;
  --olive:#a7b97a; --olive-ink:#141810; --blue:#8fb2d0; --blue-ink:#10161c; --sand:#d1b574; --sandbg:#2a2618;
  --red:#e3907f; --redbg:#2e1c18; --good:#8fca93; --goodbg:#18261a; --bluebg:#18222b;
  --day:#5a4f2c; --arvo:#5a4130; --night:#3a4d6c; --night-ink:#ffffff; --off:#33452b;
  --series:#b5c785; --grid:#2a3023; --focus:#d1b574; color-scheme:dark;
  --k-str:#3987e5; --k-run:#d95926; --k-swim:#199e70; --k-pack:#c98500; --k-course:#d55181; --k-gpp:#008300; --k-test:#9085e9}}
:root[data-theme="dark"]{
  --bg:#111410; --surface:#1a1e17; --surface2:#20251c; --ink:#e6e9dd; --muted:#a2a995; --faint:#7c836f; --line:#343a2d;
  --olive:#a7b97a; --olive-ink:#141810; --blue:#8fb2d0; --blue-ink:#10161c; --sand:#d1b574; --sandbg:#2a2618;
  --red:#e3907f; --redbg:#2e1c18; --good:#8fca93; --goodbg:#18261a; --bluebg:#18222b;
  --day:#5a4f2c; --arvo:#5a4130; --night:#3a4d6c; --night-ink:#ffffff; --off:#33452b;
  --series:#b5c785; --grid:#2a3023; --focus:#d1b574; color-scheme:dark;
  --k-str:#3987e5; --k-run:#d95926; --k-swim:#199e70; --k-pack:#c98500; --k-course:#d55181; --k-gpp:#008300; --k-test:#9085e9}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--olive)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok i{background:var(--good)} .sync.local i{background:var(--sand)} .sync.err i{background:var(--red)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--display);font-weight:600;color:var(--faint);cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--olive)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.02;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:20px;text-transform:uppercase;letter-spacing:.03em;color:var(--olive)}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.B h2{color:var(--blue)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.muted{color:var(--muted)} .small{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.07em;padding:1px 7px;border-radius:4px;color:var(--ink);vertical-align:1px}
.chip.DAY{background:var(--day)} .chip.ARVO{background:var(--arvo)} .chip.NIGHT{background:var(--night);color:var(--night-ink)} .chip.OFF{background:var(--off)}
.tag{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.07em;padding:1px 7px;border-radius:4px;background:var(--olive);color:var(--olive-ink)}
.B .tag{background:var(--blue);color:var(--blue-ink)}
.ad{display:inline-block;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.06em;color:#fff;background:var(--red);border-radius:3px;padding:0 4px;vertical-align:1px}
:root[data-theme="dark"] .ad{color:#1a0f0c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ad{color:#1a0f0c}}
.sb{display:block;font-size:12.5px;color:var(--red);font-weight:400;line-height:1.25}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.btn.pri{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.B .btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* day view */
.dayhead{padding-top:14px;display:flex;flex-direction:column;gap:6px}
.dayhead .when{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dayhead .cyc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.meta{font-size:13.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.banner{border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.35}
.banner.test{background:var(--redbg);border:1px solid var(--red)}
.banner.info{background:var(--sandbg);border:1px solid var(--sand)}
.banner.blue{background:var(--bluebg);border:1px solid var(--blue)}
.quick{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;align-items:end}
.done{min-height:48px;border-radius:8px;border:2px solid var(--olive);background:transparent;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.B .done{border-color:var(--blue);color:var(--blue)}
.done[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink)}
.B .done[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);letter-spacing:.02em;min-width:0}
input.in,textarea.in,select.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);padding:8px 10px;font-size:16px;font-variant-numeric:tabular-nums}
textarea.in{min-height:84px;resize:vertical}
input.in:focus,textarea.in:focus{border-color:var(--focus);outline:none;background:var(--surface)}
input.in::placeholder{color:var(--faint)}
details.rx{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.rx>summary{list-style:none;cursor:pointer;padding:12px 14px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;color:var(--olive)}
.B details.rx>summary{color:var(--blue)}
details.rx>summary::-webkit-details-marker{display:none}
details.rx.fin{border-color:var(--sand)}
details.rx.fin>summary{color:var(--sand)}
h2.fint{color:var(--ink);font-size:22px;margin-bottom:2px}
.was{display:block;font-size:12px;font-weight:400;color:var(--faint);line-height:1.2}
.renp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.renp label.f{font-size:13px;color:var(--ink)}
details.rx>summary::after{content:"Hide";font-size:12px;color:var(--faint)}
details.rx:not([open])>summary::after{content:"Show"}
.rxbody{padding:0 14px 14px;font-size:15px;min-width:0}
.rxbody p{margin:0 0 9px}
.rxbody .rx{line-height:1.45}
.rxbody .flag{color:var(--red);font-size:13.5px}
.rxbody .small,.rxbody .lgnote{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0 10px}
table{border-collapse:collapse;width:100%}
table.rxt th,table.std th,table.circ th,table.mstrip th,table.mas th,table.ex th{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:6px 8px;background:var(--surface2);color:var(--muted);border-bottom:1px solid var(--line)}
table.rxt td,table.std td,table.circ td,table.mas td,table.ex td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14.5px;font-variant-numeric:tabular-nums}
table.rxt.c td:not(.l),table.circ td:not(:first-child){text-align:center}
table.mstrip td,table.mstrip th{padding:5px 7px;font-size:13px;text-align:center;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.mstrip td.me{background:var(--olive);color:var(--olive-ink)}
.g2,.g3{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.swap{margin-top:10px;border:1.5px dashed var(--blue);background:var(--bluebg);border-radius:8px;padding:10px 12px;font-size:14px}
.swap .in{margin-top:6px}

/* log widgets */
.log{display:flex;flex-direction:column;gap:12px}
.ex{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}
.exh{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
.exh b{font-size:16px}
.exh span.s{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.exin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.sets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sets label.f{text-align:center}
.sets input.in{text-align:center;padding:6px 2px}
.lgt{display:flex;flex-direction:column;gap:8px}
.lgrow{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.lgrow:last-child{border-bottom:0}
.lgl{font-size:14px;font-weight:600}
.lgc{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.lgc label.f{flex:1 1 90px}
.lgc.many{display:grid;grid-template-columns:repeat(5,1fr)}
.lgc.many label.f{text-align:center}
.lgc.many input.in{text-align:center;padding:6px 2px}
.tog.ck2{width:48px;min-width:48px;font-size:20px;line-height:1}
.lgc .fixed{flex:0 0 auto;font-size:15px;padding:0 4px 10px 0;display:flex;flex-direction:column;justify-content:flex-end;color:var(--ink);font-variant-numeric:tabular-nums;min-width:72px}
.lgc .fixed small{font-size:11px;color:var(--faint)}
.tog{min-height:44px;min-width:56px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);font-weight:600;cursor:pointer;font-size:14px}
.tog[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.flds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flds.c1{grid-template-columns:1fr}
.ticks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ticks b{font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex-basis:100%}
.ticks button{width:42px;height:42px;border-radius:7px;border:1.5px solid var(--olive);background:transparent;font-weight:700;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.B .ticks button{border-color:var(--blue)}
.ticks button.on{background:var(--olive);color:var(--olive-ink)}
.B .ticks button.on{background:var(--blue);color:var(--blue-ink)}
.tst{display:flex;flex-direction:column;gap:8px}
.navrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:4px}
.navrow .btn:first-child{justify-self:start}.navrow .btn:last-child{justify-self:end}

/* plan */
.phase{display:flex;flex-direction:column;gap:8px}
.cyrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.cyrow .id{font-family:var(--display);font-weight:700;font-size:24px;color:var(--olive);line-height:1}
.cyrow.B .id{color:var(--blue)}
.cyrow.H{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 8px,var(--surface2) 8px,var(--surface2) 16px)}
.cyrow .t{font-weight:600;font-size:15px}
.cyrow .d{font-size:12.5px;color:var(--muted)}
.cyrow.now{border-color:var(--olive);box-shadow:inset 3px 0 0 var(--olive)}
.cyrow.B.now{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.bar{width:64px;height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--series)}
.cnt{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.dlist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:44px 1fr 28px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.drow:last-child{border-bottom:0}
.drow .dn{font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.drow .dn small{display:block;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em;margin-top:3px}
.drow .tt{font-weight:600;font-size:15px}
.drow .pl{font-size:13px;color:var(--muted)}
.drow.rest .tt{color:var(--muted)}
.ck{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.ck.on{background:var(--good);border-color:var(--good)}
.ck.on::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.back{background:none;border:0;padding:12px 0 2px;color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}

/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .l{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--body);font-weight:600;font-size:28px;line-height:1.1;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--faint)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
.chart .tip b{display:block;font-size:15px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--series);stroke:var(--surface);stroke-width:2}
.chart .rf{stroke:var(--muted);stroke-width:1}
.chart .xh{stroke:var(--muted);stroke-width:1}
.chart .lb{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--body)}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:18px 14px;color:var(--muted);font-size:14px;text-align:center}
table.bm td,table.bm th{padding:7px 6px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;font-variant-numeric:tabular-nums}
table.bm th{font-family:var(--display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* setup + reference */
.rm{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rm .pc{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
details.ref{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.ref>summary{cursor:pointer;padding:12px 14px;font-weight:600}
details.ref .refbody{padding:0 14px 14px;font-size:14.5px;overflow-x:auto}
.refbody .runhead,.refbody .pno{display:none}
.refbody h2{font-size:18px;margin:6px 0 8px}
.refbody h3{margin:12px 0 6px}
.refbody .box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.refbody ul.t{padding-left:18px;margin:6px 0}
.refbody .write{display:inline-block;min-width:60px;border-bottom:1px solid var(--muted)}
.refbody .g2 .mas{font-size:12px}
.refbody table{display:block;overflow-x:auto}
.refbody table tbody{display:table;width:100%}
/* roster strip, family marks, agenda (features from the SF 13-week tracker) */
.strip .in2{max-width:600px;margin:0 auto;padding:0 16px 8px}
.strip .sh{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:5px;font-variant-numeric:tabular-nums}
.strip .sh b{font-family:var(--display);font-size:15px;letter-spacing:.05em;color:var(--olive)}
.strip.B .sh b{color:var(--blue)}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.sc{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;min-height:58px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;box-shadow:inset 0 3px 0 var(--sct,var(--line));min-width:0}
.sc.DAY{--sct:var(--day)} .sc.ARVO{--sct:var(--arvo)} .sc.NIGHT{--sct:var(--night)} .sc.OFF{--sct:var(--off)}
.sc .c{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:2px}
.sc .dt{font-size:13px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.sc.now{border:2px solid var(--focus)}
.sc.sel{background:var(--surface2);outline:2px solid var(--ink);outline-offset:-2px}
.mk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--kc,var(--line));font-family:var(--display);font-weight:700;font-size:11.5px;line-height:1;color:var(--ink);background:var(--surface);flex:none}
.mk.on{background:color-mix(in srgb,var(--kc) 38%,var(--surface))}
.mk.r{border-color:transparent;color:var(--faint);background:transparent}
.mk.mv{border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12.5px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.mini{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:2px}
.mini .mk{width:100%;height:22px;border-radius:5px}
.mini .mk.now{outline:2px solid var(--focus);outline-offset:1px}
.drow{box-shadow:inset 3px 0 0 var(--kc,transparent);padding-left:8px}
.aglist{display:flex;flex-direction:column}
.agrow{display:grid;grid-template-columns:24px 1fr 14px;gap:10px;align-items:center;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.agrow:last-child{border-bottom:0}
.agrow .tt{font-weight:600;font-size:15px}
.agrow .pl{font-size:12.5px;color:var(--muted)}
.agrow .go{color:var(--faint);font-size:20px}
.rhrn{margin-top:-6px}
details.mv>summary{color:var(--muted)}
details.mv.on>summary{color:var(--ink)}
.chart .br{fill:var(--series)}
.chart .br.hi{fill:var(--ink)}
.btn.bad{background:var(--red);border-color:var(--red);color:var(--surface)}
.card.danger{border-color:var(--red)}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
/* session editor and 1RM estimate */
.edrow{gap:8px}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.banner.ed{background:var(--bluebg);border:1px solid var(--blue)}
.lnk{background:none;border:0;padding:0;color:var(--blue);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;min-height:0}
.editor{border-color:var(--blue)}
.editor h3{margin-top:6px}
.etab,.efin{border-top:1px solid var(--line);padding-top:12px}
.erow{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.erow .in{background:var(--surface)}
.ecells{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.ectl{display:flex;gap:6px;justify-content:flex-end}
.mini-btn{min-height:36px;min-width:40px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.mini-btn.del{color:var(--red);border-color:var(--red)}
.est{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.est .mini-btn{color:var(--blue);border-color:var(--blue)}
.rm .pc.src{margin-top:-4px;color:var(--faint)}
</style>

h>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Deadlift<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Barbell lunge<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Standing press<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>","fin":{"key":"burpee","title":"Burpees and get-ups","src":"OA 2.2A, 4.4B, 14.1A","mins":"10-14","body":"<p class=\"rx\"><b>8 rounds<\/b> for time: 10 burpees, then 10 get-ups. Get-ups: lie flat, stand up (OA names them without defining them; same reading as SASR \"Get Up\"). <span class=\"ad\">ADAPT<\/span> OA runs 10 rounds.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Burpees<\/td><td>10<\/td><td>-<\/td><\/tr><tr><td class='l'>Get-ups<\/td><td>10<\/td><td>-<\/td><\/tr><\/table><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>","plan":"Burpees and get-ups (~10-14 min)"}},{"kind":"test","title":"Water baseline","src":"TRG test items","dress":"Boots &amp; overalls","inten":"Test","venue":"Pool","plan":"TRG water items in B&amp;O + 400m swim test","body":"<p class=\"rx\">TRG fitness test water items, in this order: underwater swim first while fresh, then brick dive and tread, then 100m for time. Boots and overalls throughout. Then 5 min easy, then 400m in overalls for time (SF 1.1 pm trial swim test).<\/p><p class=\"small\">Spotter on deck for every underwater swim and brick dive. No hyperventilating before a breath-hold, and 2 min or more between attempts.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Item<\/th><th>Result<\/th><th>Pass?<\/th><\/tr><tr><td class=\"l\">15m underwater swim, B&amp;O<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Brick dive, B&amp;O<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Tread water, B&amp;O (2 min+)<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">100m swim, B&amp;O (under 4:00)<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"gpp","title":"GPP circuit (Week 1)","src":"SASR 1.5","dress":"PT kit","inten":"RPE 6-7","venue":"Home gym","plan":"10 rounds: Walking lunge, DB in each hand; Push press; Burpee; Farmers walk, DB in each hand","body":"<p class=\"rx\">10 rounds, 60-90 sec rest between rounds. Circuit: work down the list, rest, repeat. RPE 6-7 (70-80% HRmax, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm): a constant hard pace, never to failure. Most sessions run 20-40 min with rest (SASR).<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Walking lunge, DB in each hand<\/td><td>20m<\/td><td>2 x 20kg<\/td><\/tr><tr><td class='l'>Push press<\/td><td>15<\/td><td>20kg bar<\/td><\/tr><tr><td class='l'>Burpee<\/td><td>15<\/td><td>-<\/td><\/tr><tr><td class='l'>Farmers walk, DB in each hand<\/td><td>30m<\/td><td>2 x 24kg<\/td><\/tr><\/table>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><span>9<\/span><span>10<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"run","title":"ESD: 4 x 1600m","src":"SASR 1.3 (repeat)","dress":"PT kit","inten":"RPE 9","venue":"Track / oval","plan":"4 x 1600m, 2 min rest","body":"<p class=\"rx\"><b>4 x 1600m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route.<\/p><p class=\"rx\"><span class=\"ad\">ADAPT<\/span> In place of the SASR baseline test, SASR 1.1 (program choice). SASR Weeks 2-6 run ESD twice a week; A1 now repeats 1.3 the same way.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"cardio","title":"Machine circuit (low)","src":"SF 1.3 am","dress":"PT kit","inten":"Low","venue":"","plan":"40 min bike, elliptical, rower, low","body":"<p class=\"rx\"><b>SF electronic machine circuit, 40 min, low intensity<\/b> (40-60% HRmax, <span class=\"bpm\" data-p=\"40\">75<\/span>-<span class=\"bpm\" data-p=\"60\">112<\/span> bpm). Bike (75-85 rpm), then elliptical (for the SF stepper, 50-60 steps/min), then rower (30-32 strokes/min), about 13 min each. An endurance cross-training session at low intensity (SF).<\/p>","log":"<div class=\"flds c4\"><div class=\"fld\"><span>Bike<\/span><i><\/i><\/div><div class=\"fld\"><span>Elliptical<\/span><i><\/i><\/div><div class=\"fld\"><span>Rower<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg HR<\/span><i><\/i><\/div><\/div>"},{"kind":"test","title":"TRG land baseline","src":"TRG test items / SASR 1.6","dress":"20kg pack, boots","inten":"Test","venue":"Measured route + home gym","plan":"5km / 20kg walk for time, 75kg deadlift, vest pull-ups + hang","body":"<p class=\"rx\">TRG fitness test land items you can run at home. March on a flat, measured 5km, boots, walking only. Deadlift and vest work after the march. Log the vest weight and use the same one every time: the standards on record do not state it. Not trained in this booklet: the obstacle course and 75kg dummy drag (no drag kit). <span class=\"ad\">ADAPT<\/span> Replaces SASR 1.6 (18kg, 7km): this 5km test march covers it.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Item<\/th><th>Result<\/th><th>Pass?<\/th><\/tr><tr><td class=\"l\">5km march, 20kg pack, walking (under 40:00)<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Deadlift 75kg, 1 rep<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3 pull-ups, vest<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">30 sec dead hang, vest<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table><div class=\"flds c2\"><div class=\"fld\"><span>Vest kg<\/span><i><\/i><\/div><div class=\"fld\"><span>5km avg pace<\/span><i><\/i><\/div><\/div>"}]},{"id":"A2","phase":"A","wk":2,"label":"Prep","sub":"SASR Week 2","note":"From here every pack march opens with 5km at 8:00/km: test pace now, course forced-march pace later.","dropped":"","hold":false,"days":[{"kind":"str","title":"Strength 1","src":"SASR 2.1","dress":"PT kit","inten":"70-75%","venue":"Home gym","plan":"3 x 8 at 70-75%: Back squat, Bench press","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Explosive cable chop, high to low <span class=\"sb\">for med ball slam (7kg)<\/span><\/td><td>3 x 6<\/td><td>explosive<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Back squat<\/td><td>3 x 8<\/td><td>70-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Bench press<\/td><td>3 x 8<\/td><td>70-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Lat pulldown<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">DB bent-over row<\/td><td>3 x 15<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>","fin":{"key":"cadence","title":"Cadence pull-ups and push-ups","src":"OA 2.6A, 3.4B, 3.6A","mins":"8-10","body":"<p class=\"rx\"><b>3 rounds:<\/b> max cadence pull-ups, then max cadence push-ups. Stop each set when you lose the beat. <span class=\"ad\">ADAPT<\/span> OA gives no rest; take 2 min between rounds.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Cadence pull-ups<\/td><td>max<\/td><td>-<\/td><\/tr><tr><td class='l'>Cadence push-ups<\/td><td>max<\/td><td>-<\/td><\/tr><\/table><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p><p class=\"small\">Cadence: 3 seconds per rep. Operator Actual prescribes a \"3 sec Cadence\" without defining it; the booklet reads it as one rep every 3 seconds. Run it off a metronome app and use the same beat for every cadence session and test.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Round<\/th><th>Pull-ups<\/th><th>Push-ups<\/th><\/tr><tr><td class=\"l\">Round 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Round 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Round 3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>","plan":"Cadence pull-ups and push-ups (~8-10 min)"}},{"kind":"run","title":"ESD: 4 x 1600m","src":"SASR 2.2","dress":"PT kit","inten":"RPE 9","venue":"Track / oval","plan":"4 x 1600m, 2 min rest","body":"<p class=\"rx\"><b>4 x 1600m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 2.3","dress":"PT kit","inten":"70-75%","venue":"Home gym","plan":"3 x 8 at 70-75%: Deadlift, Barbell lunge","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Deadlift<\/td><td>3 x 8<\/td><td>70-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Barbell lunge<\/td><td>3 x 8<\/td><td>70-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Standing press<\/td><td>3 x 15<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>","fin":{"key":"carry","title":"Carry complex","src":"OA 1.2A, 5.3B, 7.1A","mins":"12-15","body":"<p class=\"rx\"><b>4 rounds<\/b>, moving steadily. <span class=\"ad\">ADAPT<\/span> OA runs 6 rounds; 4 keeps the work day inside about 70 min. OA gives no loads: farmers carry at 2 x 24kg to match the jerry carry. <span class=\"ad\">ADAPT<\/span> Goblet squats replace OA's overhead lunges (program choice), at 24kg as in SASR GPP 2.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Farmers carry, DB in each hand<\/td><td>40m<\/td><td>2 x 24kg<\/td><\/tr><tr><td class='l'>Goblet squats<\/td><td>20<\/td><td>24kg DB<\/td><\/tr><tr><td class='l'>Lunges<\/td><td>20<\/td><td>Bodyweight<\/td><\/tr><tr><td class='l'>Burpees<\/td><td>10<\/td><td>-<\/td><\/tr><\/table><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Goblet DB kg<\/span><i><\/i><\/div><\/div>","plan":"Carry complex (~12-15 min)"}},{"kind":"swim","title":"Swim","src":"SF 1.7 am","dress":"Swimmers","inten":"High","venue":"Pool","plan":"12 x 50m at 1:1, 2 min tread; 2 x 15m underwater","body":"<p class=\"rx\"><b>12 x 50m at 1:1<\/b> (rest = swim time), then 2 min tread water. High.<\/p><p class=\"rx\"><b>Then:<\/b> 2 x 15m underwater (spotter).<\/p><p class=\"small\">Spotter on deck for every underwater swim and brick dive. No hyperventilating before a breath-hold, and 2 min or more between attempts.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg / rep<\/span><i><\/i><\/div><div class=\"fld\"><span>Tread water<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"gpp","title":"GPP circuit (Week 2)","src":"SASR 2.5","dress":"PT kit","inten":"RPE 6-7","venue":"Home gym","plan":"10 rounds: Goblet squat; Row; Push-ups; Pull-ups","body":"<p class=\"rx\">10 rounds, 1 min rest between rounds. Circuit: work down the list, rest, repeat. RPE 6-7 (70-80% HRmax, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm): a constant hard pace, never to failure. Most sessions run 20-40 min with rest (SASR).<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Goblet squat<\/td><td>20<\/td><td>24kg<\/td><\/tr><tr><td class='l'>Row<\/td><td>200m<\/td><td>- <span class='sb'>SASR prints 15 in the reps column<\/span><\/td><\/tr><tr><td class='l'>Push-ups<\/td><td>20<\/td><td>-<\/td><\/tr><tr><td class='l'>Pull-ups<\/td><td>10<\/td><td>-<\/td><\/tr><\/table>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><span>9<\/span><span>10<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Pack march: 20kg, 8km","src":"SASR 2.6","dress":"20kg pack, boots","inten":"Steady","venue":"Bush / gravel","plan":"20kg, 8km; first 5km at 8:00/km","body":"<p class=\"rx\"><b>20kg, 8km.<\/b> First 5km at 8:00/km or faster, walking only: the TRG test standard (5km in under 40 min). The 2026 course forced march asked for the same 5km in 40 min under about 30kg. Then a steady pace to the finish. Load = total pack weight (SASR loads cover pack and webbing). Grass, gravel or bush tracks (SF). Drink before, during and after; eat within 30 min after (SF).<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>First 5km split<\/span><i><\/i><\/div><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Water / food<\/span><i><\/i><\/div><\/div>"},{"kind":"ph","title":"Push-ups and heaves: 6 x 20 / 6 x 5","src":"SF 1.4 pm","dress":"PT kit","inten":"-","venue":"","plan":"6 x 20 push-ups, 6 x 5 heaves, Abs &amp; L-back 1, bear crawl 2 x 20m out and back","body":"<p class=\"rx\"><b>6 x 20 push-ups and 6 x 5 heaves<\/b> (pull-ups), alternate them. Then Abs &amp; Lower Back 1 and the lower back block, below.<\/p><div class=\"g2 tight\"><div><table class=\"rxt\"><tr><th class=\"l\">Abs &amp; Lower Back 1 (SF)<\/th><th>Reps<\/th><\/tr><tr><td class='l'>BFA sit-up<\/td><td>10<\/td><\/tr><tr><td class='l'>Alt wrist to alt knee<\/td><td>10<\/td><\/tr><tr><td class='l'>Crunches<\/td><td>10<\/td><\/tr><tr><td class='l'>Sliding BFA (hands stay on floor)<\/td><td>10<\/td><\/tr><tr><td class='l'>Heel touches (one side at a time)<\/td><td>10<\/td><\/tr><tr><td class='l'>Skip (rope, or 30 sec bike)<\/td><td>50 revs<\/td><\/tr><\/table><p class=\"lgnote\">Top to bottom, 5-7 rounds continuous, feet not held.<\/p><div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><\/div><\/div><div><table class=\"rxt\"><tr><th class=\"l\">Lower back block (SF)<\/th><th>Volume<\/th><\/tr><tr><td class='l'>Back extension, no hyperextension<\/td><td>12 x 2<\/td><\/tr><tr><td class='l'>Prone single leg raise<\/td><td>12 x 2<\/td><\/tr><tr><td class='l'>Prone alt arm and leg raise<\/td><td>12 x 2<\/td><\/tr><tr><td class='l'>Alt arm and leg raise, hands and knees<\/td><td>12 x 2<\/td><\/tr><tr><td class='l'>Left and right hip rolls<\/td><td>12 each x 2<\/td><\/tr><\/table><p class=\"lgnote\">Top to bottom, twice through. Swiss ball or floor if no back-extension machine.<\/p><div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><\/div><\/div><\/div><p class=\"rx\" style=\"margin-top:2mm\"><b>Then bear crawl: 2 x (20m forward, 20m in reverse back to the start)<\/b>, hands and feet only, knees off the ground, 1 min rest between rounds. <span class=\"ad\">ADAPT<\/span> Booklet addition (program choice): the diary Devil half-mile crawls 40m forward out and 40m reverse back; this builds to it from A10.<\/p><div class=\"ticks\"><b>Crawl rounds<\/b><span>1<\/span><span>2<\/span><\/div>","log":"<table class=\"lg\"><tr><th class='l'>Set<\/th> \"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>","fin":{"key":"core","title":"Core rounds","src":"OA 2.5B, 3.2A, 4.1A","mins":"10-12","body":"<p class=\"rx\"><b>4 rounds<\/b> for time: 20 hanging leg raises, 20 crunches, 1 min plank. As written in OA. The 2026 course punished cadence breaks with planks and static holds.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Hanging leg raises<\/td><td>20<\/td><td>-<\/td><\/tr><tr><td class='l'>Crunches<\/td><td>20<\/td><td>-<\/td><\/tr><tr><td class='l'>Plank<\/td><td>1 min<\/td><td>-<\/td><\/tr><\/table><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>","plan":"Core rounds (~10-12 min)"}},{"kind":"run","title":"Intervals: 3 x 1000m","src":"SASR 7.2","dress":"Vest 9kg, boots on rep 1","inten":"RPE 9","venue":"Track / oval","plan":"3 x 1000m, 2 min rest","body":"<p class=\"rx\"><b>3 x 1000m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route. Boots on rep 1 only, then runners. SASR: running in boots for long periods raises impact load at the ankle, knee and hip. Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 7.3","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"3 x 10 at 65-75%: Rack pull, Back squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p><p class=\"flag\">SASR strength sheet prints 2 x 10 for rack pull and back squat; the program table (7.3) says 3 x 10. Booklet uses 3 x 10.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Rack pull<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Back squat<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Push press<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>","fin":{"key":"carry","title":"Carry complex","src":"OA 1.2A, 5.3B, 7.1A","mins":"12-15","body":"<p class=\"rx\"><b>4 rounds<\/b>, moving steadily. <span class=\"ad\">ADAPT<\/span> OA runs 6 rounds; 4 keeps the work day inside about 70 min. OA gives no loads: farmers carry at 2 x 24kg to match the jerry carry. <span class=\"ad\">ADAPT<\/span> Goblet squats replace OA's overhead lunges (program choice), at 24kg as in SASR GPP 2.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Farmers carry, DB in each hand<\/td><td>40m<\/td><td>2 x 24kg<\/td><\/tr><tr><td class='l'>Goblet squats<\/td><td>20<\/td><td>24kg DB<\/td><\/tr>< 80\">150<\/span> bpm): a constant hard pace, never to failure. Most sessions run 20-40 min with rest (SASR).<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Cadence push-ups<\/td><td>40<\/td><td>-<\/td><\/tr><tr><td class='l'>Cadence pull-ups<\/td><td>max<\/td><td>-<\/td><\/tr><tr><td class='l'>Row<\/td><td>300m<\/td><td>-<\/td><\/tr><\/table><p class=\"rx\">Cadence: 3 seconds per rep, the booklet's reading of Operator Actual's \"3 sec Cadence\" (SASR gives no cadence). If the 40 breaks, rest-pause to finish the set.<\/p>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Pack march: 30kg, 10km","src":"SASR 7.6","dress":"30kg pack, boots","inten":"Steady","venue":"Bush / gravel","plan":"30kg, 10km; first 5km at 8:00/km","body":"<p class=\"rx\"><b>30kg, 10km.<\/b> First 5km at 8:00/km or faster, walking only: the TRG test standard (5km in under 40 min). The 2026 course forced march asked for the same 5km in 40 min under about 30kg. Then a steady pace to the finish. Load = total pack weight (SASR loads cover pack and webbing). Grass, gravel or bush tracks (SF). Drink before, during and after; eat within 30 min after (SF).<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>First 5km split<\/span><i><\/i><\/div><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Water / food<\/span><i><\/i><\/div><\/div>"},{"kind":"ph","title":"Push-ups and heaves: 6 x 25 / 6 x 8", e":"Home gym","plan":"3 x 8 at 75-80%: Front squat, DB bench press","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Explosive cable chop, high to low <span class=\"sb\">for med ball slam (7kg)<\/span><\/td><td>3 x 6<\/td><td>explosive<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Front squat<\/td><td>3 x 8<\/td><td>75-80%<\/td><td>3 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">DB bench press<\/td><td>3 x 8<\/td><td>75-80%<\/td><td>3 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Seated row<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Face pull<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>","fin":{"key":"wpull","title":"Max-weight pull-ups","src":"OA 5.2B, 6.3B, 8.2A","mins":"8-10","body":"<p class=\"rx\"><b>4 rounds<\/b> of max-weight pull-ups, 5-20kg on the weight belt (OA range). Clean reps, full hang at the bottom. <span class=\"ad\">ADAPT<\/span> OA gives no rep target or rest; aim for 3-5 clean reps and rest 2-3 min. Builds the TRG vest pull-ups and hang.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Weighted pull-ups<\/td><td>max<\/td><td>5-20kg belt<\/td><\/tr><\/table><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Round<\/th><th>kg<\/th><th>Reps<\/th><\/tr><tr><td class=\"l\">Round 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Round 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Round 3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Round 4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>","plan":"Max-weight pull-ups (~8-10 min)"}},{"kind":"run","title":"Intervals: 3 x 1200m","src":"SASR 8.2","dress":"Vest 9kg, boots on rep 1","inten":"RPE 9","venue":"Track / oval","plan":"3 x 1200m, 2 min rest","body":"<p class=\"rx\"><b>3 x 1200m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route. Boots on rep 1 only, then runners. SASR: running in boots for long periods raises impact load at the ankle, knee and hip. Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 8.3","dress":"PT kit","inten":"75-80%","venue":"Home gym","plan":"3 x 8 at 75-80%: Rack pull, Back squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/t e list, rest, repeat. RPE 6-7 (70-80% HRmax, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm): a constant hard pace, never to failure. Most sessions run 20-40 min with rest (SASR).<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Burpee broad jump<\/td><td>20m<\/td><td>-<\/td><\/tr><tr><td class='l'>Farmers carry, DB in each hand<\/td><td>20m<\/td><td>2 x 28-32kg<\/td><\/tr><tr><td class='l'>BFA sit-up<\/td><td>20<\/td><td>-<\/td><\/tr><\/table>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><span>9<\/span><span>10<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Pack march: 28kg, 12km","src":"SASR 8.6","dress":"28kg pack, boots","inten":"Steady","venue":"Bush / gravel","plan":"28kg, 12km; first 5km at 8:00/km","body":"<p class=\"rx\"><b>28kg, 12km.<\/b> First 5km at 8:00/km or faster, walking only: the TRG test standard (5km in under 40 min). The 2026 course forced march asked for the same 5km in 40 min under about 30kg. Then a steady pace to the finish. Load = total pack weight (SASR loads cover pack and webbing). Grass, gravel or bush tracks (SF). Drink before, during and after; eat within 30 min after (SF).<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>First 5km split<\/span><i><\/i><\/div><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Water / food<\/span><i><\/i><\/div><\/div>"},{"kind":"ph","title":"Push-up <td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"run","title":"1600m time trial (sets MAS)","src":"SASR MAS trial","dress":"PT kit","inten":"Max","venue":"Track / oval","plan":"1600m flat out: sets MAS distances","body":"<p class=\"rx\">Warm up 10 min. Run 1600m once, flat out, on a marked track or oval. Your time sets every MAS session from A11 on: each MAS sheet prints the distances (SASR MAS table). <span class=\"ad\">ADAPT<\/span> SASR does not place this trial; the booklet puts it here, swapping out interval 10.2.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>1600m time<\/span><i><\/i><\/div><div class=\"fld\"><span>MAS 30 / 120% (m)<\/span><i><\/i><\/div><div class=\"fld\"><span>MAS 15 / 120% (m)<\/span><i><\/i><\/div><div class=\"fld\"><span>Conditions<\/span><i><\/i><\/div><\/div>"},{"kind":"str","title":"Strength 2","src":"SASR 10.3","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"2 x 10 at 65-75%: Rack pull, Back squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/t overalls (TRG test dress), overalls, swimmers.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>400m swim<\/td><td>1<\/td><td>Boots &amp; overalls<\/td><\/tr><tr><td class='l'>200m swim<\/td><td>1<\/td><td>Overalls<\/td><\/tr><tr><td class='l'>200m swim<\/td><td>1<\/td><td>Swimmers<\/td><\/tr><\/table>","log":"<table class=\"lg\"><tr><th class=\"l\">Swim<\/th><th>Time<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">400m B&amp;O<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">200m overalls<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">200m swimmers<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"gpp","title":"SF Body Weight Circuit","src":"SF 4.1 pm","dress":"PT kit","inten":"Hard","venue":"","plan":"BW circuit, columns 1-3","body":"<p class=\"rx\"><b>SF Body Weight Circuit, columns 1-3.<\/b> Column 1 top to bottom, then the next column in the same order. Record total time. Struggling: take 1 min rest after each skip (SF). <span class=\"ad\">ADAPT<\/span> Unload cycle: columns 1-3 only.<\/p><table class=\"rxt c\"><tr><th class='l'>Exercise<\/th><th>1st<\/th><th>2nd<\/th><th>3rd<\/th><\/tr><tr><td class='l'>Overgrasp heaves (pull-ups)<\/td><td>10<\/td><td>8<\/td><td>6<\/td><\/tr><tr><td class='l'>Push-ups<\/td><td>20<\/td><td>18<\/td><td>16<\/td><\/tr><tr><td class='l'>Lying overgrasp heaves (inverted rows)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><\/tr><tr><td class='l'>Full body dips<\/td><td>10<\/td><td>8<\/td><td>6<\/td><\/tr><tr><td class='l'>Weighted squats (20kg)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><\/tr><tr><td class='l'>Weighted step-ups (10kg, bench)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><\/tr><tr><td class='l'>BFA sit-ups<\/td><td>20<\/td><td>18<\/td><td>16<\/td><\/tr><tr><td class='l'>Skip (rope, or bike)<\/td><td>1 min<\/td><td>1 min<\/td><td>1 min<\/td><\/tr><\/table>","log":"<div class=\"ticks\"><b>Columns<\/b><span>1<\/span><span>2<\/span><span>3<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Last time<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Pack march: 30kg, 15km","src":"SASR 10.6","dress":"30kg pack, boots","inten":"Steady","venue":"Bush / gravel","plan":"30kg, 15km; first 5km at 8:00/km","body":"<p class=\"rx\"><b>30kg, 15km.<\/b> First 5km at 8:00/km or faster, walking only: the TRG test standard (5km in under 40 min). The 2026 course forced march asked for the same 5km in 40 min under about 30kg. Then a steady pace to the finish. Load = total pack weight (SASR loads cover pack and webbing). Grass, gravel or bush tracks (SF). Drink before, during and after; eat within 30 min after (SF).<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>First 5km split<\/span><i><\/i><\/div><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Water / food<\/span><i><\/i><\/div><\/div>"},{"kind":"ph","title":"Push-ups and heaves: 6 x 25 / 6 x 8","src":"SF 5.4 pm","dress":"PT kit","inten":"-","venue":"","plan":"6 x 25 push-ups, 6 x 8 heaves, Abs &amp; L-back 1, bear crawl 2 x 40m out and back","body":"<p class=\"rx\"><b>6 x 25 push-ups and 6 x 8 heaves<\/b> (pull-ups), alternate them. Then Abs &amp; Lower Back 1 and the lower back block, below.<\/p><div class=\"g2 tight\"><div><table class=\"rxt\"><tr><th class=\"l\">Abs &amp; Lower Back 1 (SF)<\/th><th>Reps<\/th><\/tr><tr><td class='l'>BFA sit-up<\/td><td>10<\/td><\/tr><tr><td class='l'>Alt wrist to alt knee<\/td><td>10<\/td><\/tr><tr><td class='l'>Crunches<\/td><td>10<\/td><\/tr><tr><td class='l'>Sliding BFA (hands stay on floor)<\/td><td>10<\/td><\/tr><tr><td class='l'>Heel touches (one side at a time)<\/td><td>10<\/td><\/tr><tr><td class='l'>Skip (rope, or 30 sec bike)<\/td><td>50 revs<\/td><\/tr><\/table><p class=\"lgnote\">Top to bottom, 5-7 rounds continuous, feet not held.<\/p><div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><\/div><\/div><div><table class=\"rxt\"><tr><th class=\"l\">Lower back block (SF)<\/th><th>Volume<\/th><\/tr><tr><td class='l'>Back extension, no hyperextension<\/td><td>12 x 2<\/td><\/tr><tr><td class='l'>Prone single leg raise<\/td><td>12 x 2<\/td><\/tr><tr><td class='l'>Prone alt arm and leg raise<\/td><td>12 x 2<\/td><\/tr><tr><td class='l'>Alt arm and leg raise, hands and knees<\/td><td>12 x 2<\/td><\/tr><tr><td class='l'>Left and right hip rolls<\/td><td>12 each x 2<\/td><\/tr><\/table><p class=\"lgnote\">Top to bottom, twice through. Swiss ball or floor if no back-extension machine.<\/p><div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><\/div><\/div><\/div><p class=\"rx\" style=\"margin-top:2mm\"><b>Then bear crawl: 2 x (40m forward, 40m in reverse back to the start)<\/b>, hands and feet only, knees off the ground, 1 min rest between rounds. <span class=\"ad\">ADAPT<\/span> Booklet addition (program choice): the diary Devil half-mile crawls 40m forward out and 40m reverse back; this builds to it from A10.<\/p><div class=\"ticks\"><b>Crawl rounds<\/b><span>1<\/span><span>2<\/span><\/div>","log":"<table class=\"lg\"><tr><th class='l'>Set<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><tr><td class='l'>Push-ups (25)<\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><\/tr><tr><td class='l'>Heaves (8)<\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><td style='height:6.5mm'><\/td><\/tr><\/table>"},{"kind":"run","title":"Intervals: 3 x 1000m","src":"SASR 10.4","dress":"Vest 9kg, boots on rep 1","inten":"RPE 9","venue":"Track / oval","plan":"3 x 1000m, 2 min rest","body":"<p class=\"rx\"><b>3 x 1000m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route. Boots on rep 1 only, then runners. SASR: running in boots for long periods raises impact load at the ankle, knee and hip. Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"}]},{"id":"A11","phase":"A","wk":11,"label":"Strength endurance","sub":"SASR Week 11 &middot; Hold template 1","note":"MAS sessions start: each MAS sheet prints your cone distance against your A10 1600m time. HOLD TEMPLATE: Holds run A11, A12, A13, A14 in order.","dropped":"","hold":true,"days":[{"kind":"str","title":"Strength 1","src":"SASR 11.1","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"3 x 10 at 65-75%: Box squat, Incline bench press","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table ist<\/th><th>Load<\/th><\/tr><tr><td class='l'>DB step-ups, each leg<\/td><td>20<\/td><td>10-15kg each hand<\/td><\/tr><tr><td class='l'>Bike<\/td><td>10 cal<\/td><td>-<\/td><\/tr><\/table><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>DB kg<\/span><i><\/i><\/div><\/div>","plan":"Step-ups and bike (~12-15 min)"}},{"kind":"swim","title":"Swim in clothes (SASR GPP 12)","src":"SASR 12.5","dress":"Boots &amp; overalls","inten":"Med","venue":"Pool","plan":"400m B&amp;O, 200m overalls, 200m swimmers","body":"<p class=\"rx\">Swim in clothes, 2 min rest between swims (SASR). <span class=\"ad\">ADAPT<\/span> SASR strips kit in stages (cams + runners, cams, cam pants). Booklet: boots and overalls (TRG test dress), overalls, swimmers.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>400m swim<\/td><td>1<\/td><td>Boots &amp; overalls<\/td><\/tr><tr><td class='l'>200m swim<\/td><td>1<\/td><td>Overalls<\/td><\/tr><tr><td class='l'>200m swim<\/td><td>1<\/td><td>Swimmers<\/td><\/tr><\/table><p class=\"rx\"><b>Then:<\/b> 1 x 15m underwater and 1 brick dive in boots and overalls (spotter).<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Swim<\/th><th>Time<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">400m B&amp;O<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">200m overalls<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">200m swimmers<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"gpp","title":"SF Body Weight Circuit","src":"SF 5.1 pm","dress":"PT kit","inten":"Hard","venue":"","plan":"BW circuit, columns 1-5","body":"<p class=\"rx\"><b>SF Body Weight Circuit, columns 1-5.<\/b> Column 1 top to bottom, then the next column in the same order. Record total time. Struggling: take 1 min rest after each skip (SF).<\/p><table class=\"rxt c\"><tr><th class='l'>Exercise<\/th><th>1st<\/th><th>2nd<\/th><th>3rd<\/th><th>4th<\/th><th>5th<\/th><\/tr><tr><td class='l'>Overgrasp heaves (pull-ups)<\/td><td>10<\/td><td>8<\/td><td>6<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td class='l'>Push-ups<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td class='l'>Lying overgrasp heaves (inverted rows)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td class='l'>Full body dips<\/td><td>10<\/td><td>8<\/td><td>6<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td class='l'>Weighted squats (20kg)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td class='l'>Weighted step-ups (10kg, bench)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td class='l'>BFA sit-ups<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td class='l'>Skip (rope, or bike)<\/td><td>1 min<\/td><td>1 min<\/td><td>1 min<\/td><td>1 min<\/td><td>1 min<\/td><\/tr><\/table>","log":"<div class=\"ticks\"><b>Columns<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Last time<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Pack march: 28kg, 90 min","src":"SASR 12.6","dress":"28kg pack, boots","inten":"Steady","venue":"Bush / gravel","plan":"28kg, 90 min; first 5km at 8:00/km","body":"<p class=\"rx\"><b>28kg, 90 min.<\/b> First 5km at 8:00/km or faster, walking only: the TRG test standard (5km in under 40 min). The 2026 course forced march asked for the same 5km in 40 min under about 30kg. Then a steady pace to the finish. Load = total pack weight (SASR loads cover pack and webbing). Grass, gravel or bush tracks (SF). Drink before, during and after; eat within 30 min after (SF).<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>First 5km split<\/span><i><\/i><\/div><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Water / food<\/span><i><\/i><\/div><\/div>"},{"kind":"ph","title":"Push-ups and heaves: 6 x 30 / 6 x 10","src":"SF 9.4 pm","dress":"PT kit","inten":"-","venue":"","plan":"6 x 30 push-ups, 6 x 10 heaves, Abs &amp; L-back 1, bear crawl 2 x 40m out and back","body":"<p class=\"rx\"><b>6 x 30 push-ups and 6 x 10 heaves<\/b> (pull-ups), alternate them. Then Abs &amp; Lower Back 1 and the lower back block, below.<\/p><div class=\"g2 tight\"><div><table class=\"rxt\"><tr><th class=\"l\">Abs &amp; Lower Back 1 (SF)<\/th><th>Reps<\/th><\/tr><tr><td class='l'>BFA sit-up<\/td><td>10<\/td><\/tr><tr><td class='l'>Alt wrist to alt knee<\/td><td>10<\/td><\/tr><tr><td class='l'>Crunches<\/td><td>10<\/td><\/tr><tr><td class='l'>Sliding BFA (hands stay on floor)<\/td><td>10<\/td><\/tr><tr><td class='l'>Heel touches (one side at a time)<\/td><td>10<\/td><\/tr><tr><td class='l'>Skip (rope, or 30 sec bike)<\/td><td>50 revs<\/td><\/tr><\/table><p class=\"lgnote\">Top to bottom, 5-7 rounds continuous, feet not held.<\/p><div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><\/div><\
