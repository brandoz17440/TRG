de, bird dog 1 min each side, wall sit 2 min; 30 sec between stations.<\/p><p class=\"small\">Cadence: 3 seconds per rep. Operator Actual prescribes a \"3 sec Cadence\" without defining it; the booklet reads it as one rep every 3 seconds. Run it off a metronome app and use the same beat for every cadence session and test.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Curls done<\/span><i><\/i><\/div><div class=\"fld\"><span>Cadence breaks<\/span><i><\/i><\/div><div class=\"fld\"><span>Push-ups set 1<\/span><i><\/i><\/div><div class=\"fld\"><span>Push-ups set 2<\/span><i><\/i><\/div><div class=\"fld\"><span>Push-ups set 3<\/span><i><\/i><\/div><div class=\"fld\"><span>Holds: where it broke<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Forced march simulation, 30kg","src":"Diary Day 4 / SASR 15.6","dress":"30kg pack, boots","inten":"Max","venue":"Measured route","plan":"Diary Day 4 forced march: 5km in 40 min, then 1km per 10 min to 15km","body":"<p class=\"rx\"><b>Forced march, 30kg.<\/b> Diary Day 4: max effort, catch the bus at 5km inside 40 min; at 40 min the bus moves 1km on and you have 10 min to reach it; repeat to the 15km cut-off. Train it against the clock, <b>walking only<\/b>: hit every split below. <span class=\"ad\">ADAPT<\/span> The diary does not say walk-only. The booklet makes it walk-only (program choice), like the fitness test march, and the MARSOC prep guide advises against running under a pack in training. <span class=\"ad\">ADAPT<\/span> SASR 15.6 sets 30kg for 3 hours (its strength sheet says 20km TT). After 15km, walk easy to 3:00 total.<\/p>","log":"<table class=\"lg\">\n<tr><th class=\"l\">Mark<\/th><th>Target<\/th><th>Actual<\/th><th>Made it<\/th><\/tr><tr><td class=\"l\">5km<\/td><td>0:40:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">6km<\/td><td>0:50:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td cla =\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg HR<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>","plan":"Low-impact cardio (~15 min)"}},{"kind":"run","title":"ESD: 4 x 2000m","src":"SASR 17.2","dress":"PT kit","inten":"RPE 9","venue":"Track / oval","plan":"4 x 2000m, 2 min rest","body":"<p class=\"rx\"><b>4 x 2000m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 17.3","dress":"PT kit","inten":"85-90%","venue":"Home gym","plan":"5 x 3 at 85-90%: Deadlift, Barbell lunge","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Deadlift<\/td><td>5 x 3<\/td><td>85-90%<\/td><td>4 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><\/tr><tr><td class=\"l\">Barbell lunge<\/td><td>5 x 3<\/td><td>85-90%<\/td><td>4 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><\/tr><tr><td class=\"l\">Standing press<\/td><td>4 x 8<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"diary","title":"Devil half-mile","src":"Diary Day 1","dress":"PT kit","inten":"Hard","venue":"Work gym oval / grass","plan":"40m lines: burpees, broad jumps, TB overhead walk, bear crawl, lunges to 800m","body":"<p class=\"rx\"><b>Devil half-mile<\/b> (Diary Day 1). Two lines 40m apart. Every time you cross the start line: 5 burpees. Then out and back with each movement in turn: broad jumps, torsion bar held overhead (walking), bear crawl (forward out, reverse back), walking lunges. Keep cycling the movements until you have covered 800m: 10 out-and-backs, 50 burpees. The course ran this after 5 x 1000m, a pack march and Armageddon.<\/p><div class=\"swap\"><b>Fitness test still ahead? Do this instead, at the pool.<\/b> Boots and overalls: 2 x 15m underwater (3 min apart, spotter on deck, no hyperventilating), 2 brick dives, 3 min tread water, 100m for time. Then swimmers: 8 x 100m, 60 sec rest (SF 3.7 / 5.7 set). <span class=\"ad\">ADAPT<\/span> Booklet session from the TRG water items and an SF swim set. Log: 100m B&amp;O <i><\/i> &nbsp; 8 x 100m avg <i><\/i><\/div>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Out-and-backs<\/span><i><\/i><\/div><div class=\"fld\"><span>Slowest movement<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"gpp","title":"GPP circuit (Week 17)","src":"SASR 17.5","dress":"PT kit","inten":"RPE 6-7","venue":"Home gym","plan":"10 rounds: Burpee; Military press; Air squat; Push-ups","body":"<p class=\"rx\">10 rounds, 1 min rest between rounds. Circuit: work down the list, rest, repeat. RPE 6-7 (70-80% HRmax, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm): a constant hard pace, never to failure. Most sessions run 20-40 min with rest (SASR).<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Burpee<\/td><td>15<\/td><td>-<\/td><\/tr><tr><td class='l'>Military press<\/td><td>20<\/td><td>20kg bar<\/td><\/tr><tr><td class='l'>Air squat<\/td><td>25<\/td><td>-<\/td><\/tr><tr><td class='l'>Push-ups<\/td><td>30<\/td><td>-<\/td><\/tr><\/table>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><span>9<\/span><span>10<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Pack march: 30kg, 4 hours","src":"SASR 17.6","dress":"30kg pack, boots","inten":"Steady","venue":"Bush / hills","plan":"30kg, 4 hours, hilly","body":"<p class=\"rx\"><b>30kg, 4 hours.<\/b> Hilly route, keep moving. Eat and drink on the move each hour. Train in pairs where you can and leave your route and ETR with someone (SF). Load = total pack weight (SASR loads cover pack and webbing). Grass, gravel or bush tracks (SF). Drink before, during and after; eat within 30 min after (SF). <span class=\"ad\">ADAPT<\/span> SASR sets 45kg. Capped at 30kg, the heaviest load in the 2026 diary.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Elevation / route<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Water / food<\/span><i><\/i><\/div><div class=\"fld\"><span>Low point (hour)<\/span><i><\/i><\/div><\/div>"},{"kind":"diary","title":"Jerry carry + static holds","src":"Diary Day 2","dress":"PT kit","inten":"Hard","venue":"Driveway / grass","plan":"Farmers carry 2 x 24kg 30 min, bear hug 10 min, holds x 2","body":"<p class=\"rx\"><b>Jerry carry<\/b> (Diary Day 2: 2 x 24L jerry cans on a 650m airstrip for 7-8 hours, self-managed and silent). Mark a 50m strip with a marker every 10m. <b>Part 1, 30 min:<\/b> farmers carry, a 24kg DB in each hand. Set down only at a marker, and never more than two markers apart (diary rule). One 50m length = 1 point. <b>Part 2, 10 min:<\/b> one DB hugged to the chest (bear hug), one marker at a time (the course switched after about 15 laps). 24L of water weighs 24kg; a full can weighs more. Two water-filled jerry cans make it exact. Finish with the <b>static holds box<\/b>, 2 rounds: high plank 2 min, side plank 1 min each side, bird dog 1 min each side, wall sit 2 min; 30 sec between stations (Diary Day 2). <span class=\"ad\">ADAPT<\/span> Durations are booklet figures, built up across Phase B.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Part 1 points<\/span><i><\/i><\/div><div class=\"fld\"><span>Part 2 points<\/span><i><\/i><\/div><div class=\"fld\"><span>Grip failed at (min)<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"run","title":"ESD: 4 x 2000m","src":"SASR 17.4","dress":"Vest 9kg, runners","inten":"RPE 9","venue":"Track / oval","plan":"4 x 2000m, 2 min rest","body":"<p class=\"rx\"><b>4 x 2000m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route. Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"}]},{"id":"S3","phase":"B","wk":18,"label":"Strength block","sub":"SASR Week 18 &middot; OA 10km run","note":"SASR rests 18.5, so D5-D7 rest. D8 runs an Operator Actual 10km in place of the SASR mini test. GPP 18 (1,600 torsion bar reps) runs on D4.","dropped":"SASR 18.1 mini test (program choice: D8 runs the OA 10km). SASR prints a Week 18 GPP sheet but schedules no GPP; the booklet uses it on D4.","hold":false,"days":[{"kind":"str","title":"Strength 1","src":"SASR 18.2","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"2 x 10 at 65-75%: Box squat, Incline bench press","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Explosive cable chop, high to low <span class=\"sb\">for med ball slam (7kg)<\/span><\/td><td>3 x 6<\/td><td>explosive<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Box squat<\/td><td>2 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Incline bench press<\/td><td>2 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Weighted pull-up<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">DB row<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"run","title":"ESD: 4 x 2000m","src":"SASR 18.3","dress":"Vest 9kg, boots on rep 1","inten":"RPE 9","venue":"Track / oval","plan":"4 x 2000m, 2 min rest","body":"<p class=\"rx\"><b>4 x 2000m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route. Boots on rep 1 only, then runners. SASR: running in boots for long periods raises impact load at the ankle, knee and hip. Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 18.4","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"2 x 10 at 65-75%: Romanian deadlift, Goblet squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Romanian deadlift<\/td><td>2 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Goblet squat<\/td><td>2 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Seated press<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"gpp","title":"GPP circuit (Week 18)","src":"SASR GPP 18","dress":"PT kit","inten":"RPE 6-7","venue":"Work gym (torsion bar)","plan":"10 rounds: Military press; Bicep curl; Front squat push press; Bent-over row","body":"<p class=\"rx\">10 rounds, 1 min rest between rounds. Circuit: work down the list, rest, repeat. RPE 6-7 (70-80% HRmax, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm): a constant hard pace, never to failure. Most sessions run 20-40 min with rest (SASR).<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Military press<\/td><td>40<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Bicep curl<\/td><td>40<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Front squat push press<\/td><td>40<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Bent-over row<\/td><td>40<\/td><td>Torsion bar<\/td><\/tr><\/table><p class=\"rx\">SASR sets 12-15kg. The work-gym torsion bar weighs about 12kg.<\/p><div class=\"swap\"><b>Fitness test still ahead? Do this instead, at the pool.<\/b> Boots and overalls: 2 x 15m underwater (3 min apart, spotter on deck, no hyperventilating), 2 brick dives, 3 min tread water, 100m for time. Then swimmers: 8 x 100m, 60 sec rest (SF 3.7 / 5.7 set). <span class=\"ad\">ADAPT<\/span> Booklet session from the TRG water items and an SF swim set. Log: 100m B&amp;O <i><\/i> &nbsp; 8 x 100m avg <i><\/i><\/div>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><span>9<\/span><span>10<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"SASR 18.5"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"run","title":"Run 10km","src":"OA 5.6A / 9.6A","dress":"PT kit","inten":"RPE 6-7","venue":"Road / trail","plan":"10km continuous at RPE 6-7, runners","body":"<p class=\"rx\"><b>10km continuous run<\/b> (Operator Actual, \"10km Run\"). PT kit, runners. <span class=\"ad\">ADAPT<\/span> OA sets no pace or effort. The booklet runs it at RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm, the GPP heart-rate band.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Time<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg HR<\/span><i><\/i><\/div><div class=\"fld\"><span>Feet / shins<\/span><i><\/i><\/div><\/div>"},{"kind":"cardio","title":"Machine circuit (low)","src":"SF machine circuit","dress":"PT kit","inten":"Low","venue":"","plan":"40 min bike, elliptical, rower, low","body":"<p class=\"rx\"><b>SF electronic machine circuit, 40 min, low intensity<\/b> (40-60% HRmax, <span class=\"bpm\" data-p=\"40\">75<\/span>-<span class=\"bpm\" data-p=\"60\">112<\/span> bpm). Bike (75-85 rpm), then elliptical (for the SF stepper, 50-60 steps/min), then rower (30-32 strokes/min), about 13 min each. An endurance cross-training session at low intensity (SF).<\/p>","log":"<div class=\"flds c4\"><div class=\"fld\"><span>Bike<\/span><i><\/i><\/div><div class=\"fld\"><span>Elliptical<\/span><i><\/i><\/div><div class=\"fld\"><span>Rower<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg HR<\/span><i><\/i><\/div><\/div>"},{"kind":"elc","title":"Pack march: 30kg, 5 hours","src":"SASR 18.6","dress":"30kg pack, boots","inten":"Steady","venue":"Bush / hills","plan":"30kg, 5 hours, hilly","body":"<p class=\"rx\"><b>30kg, 5 hours.<\/b> Hilly route, keep moving. Eat and drink on the move each hour. Train in pairs where you can and leave your route and ETR with someone (SF). Load = total pack weight (SASR loads cover pack and webbing). Grass, gravel or bush tracks (SF). Drink before, during and after; eat within 30 min after (SF). <span class=\"ad\">ADAPT<\/span> SASR sets 32kg. Capped at 30kg, the heaviest load in the 2026 diary.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Elevation / route<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Water / food<\/span><i><\/i><\/div><div class=\"fld\"><span>Low point (hour)<\/span><i><\/i><\/div><\/div>"}]},{"id":"S4","phase":"B","wk":19,"label":"Strength block","sub":"SASR Week 19 &middot; Long Walk + push-up ladder","note":"SASR's first double drops to one march (program choice): the 6-hour Long Walk, then the Operator Actual push-up ladder on D9. SASR 19.5 rest moves to D10.","dropped":"SASR Week 20 is dropped to fit the 10-day cycle (see the planner). SASR 19.7 (30kg, 4 hours), the second march of the double (program choice).","hold":false,"days":[{"kind":"str","title":"Strength 1","src":"SASR 19.1","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"3 x 10 at 65-75%: Front squat, DB bench press","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p><p class=\"flag\">SASR strength sheet prints 2 x 10 for front squat and DB bench; the program table (19.1) says 3 x 10. Booklet uses 3 x 10.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Explosive cable chop, high to low <span class=\"sb\">for med ball slam (7kg)<\/span><\/td><td>3 x 6<\/td><td>explosive<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Front squat<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">DB bench press<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Seated row<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Face pull<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>","fin":{"key":"cadence","title":"Cadence pull-ups and push-ups","src":"OA 2.6A, 3.4B, 3.6A","mins":"8-10","body":"<p class=\"rx\"><b>3 rounds:<\/b> max cadence pull-ups, then max cadence push-ups. Stop each set when you lose the beat. <span class=\"ad\">ADAPT<\/span> OA gives no rest; take 2 min between rounds.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Cadence pull-ups<\/td><td>max<\/td><td>-<\/td><\/tr><tr><td class='l'>Cadence push-ups<\/td><td>max<\/td><td>-<\/td><\/tr><\/table><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p><p class=\"small\">Cadence: 3 seconds per rep. Operator Actual prescribes a \"3 sec Cadence\" without defining it; the booklet reads it as one rep every 3 seconds. Run it off a metronome app and use the same beat for every cadence session and test.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Round<\/th><th>Pull-ups<\/th><th>Push-ups<\/th><\/tr><tr><td class=\"l\">Round 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Round 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Round 3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>","plan":"Cadence pull-ups and push-ups (~8-10 min)"}},{"kind":"run","title":"ESD: 4 x 2000m","src":"SASR 19.2","dress":"Vest 9kg, runners","inten":"RPE 9","venue":"Track / oval","plan":"4 x 2000m, 2 min rest","body":"<p class=\"rx\"><b>4 x 2000m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route. Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 19.3","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"3 x 10 at 65-75%: Rack pull, Back squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p><p class=\"flag\">SASR strength sheet prints 2 x 10 for rack pull and back squat; the program table (19.3) says 3 x 10. Booklet uses 3 x 10.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Rack pull<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Back squat<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Push press<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"diary","title":"Torsion bar laps + pull-up ladder","src":"Diary Day 5","dress":"PT kit","inten":"Hard","venue":"Work gym (torsion bar)","plan":"12 TB laps (curl, thruster, upright row, press), pull-up ladder","body":"<p class=\"rx\"><b>Torsion bar laps<\/b> (Diary Day 5 PT). Mark a 30m x 30m square. At each cone, one torsion bar movement in order: 20 curls, 10 thrusters, 10 upright rows, 10 overhead press. Run to the next cone carrying the bar. One loop = 1 lap. <b>12 laps<\/b> <span class=\"ad\">ADAPT<\/span> (the course ran about 15; 12 fits the work-day window). Then the <b>pull-up ladder<\/b>: 10 pull-ups. Each time you come off the bar, 4 burpees, plus 1 more each further dismount, until all 10 are done. <span class=\"ad\">ADAPT<\/span> 10 strict unbroken: add the vest at 9kg.<\/p><div class=\"swap\"><b>Fitness test still ahead? Do this instead, at the pool.<\/b> Boots and overalls: 2 x 15m underwater (3 min apart, spotter on deck, no hyperventilating), 2 brick dives, 3 min tread water, 100m for time. Then swimmers: 8 x 100m, 60 sec rest (SF 3.7 / 5.7 set). <span class=\"ad\">ADAPT<\/span> Booklet session from the TRG water items and an SF swim set. Log: 100m B&amp;O <i><\/i> &nbsp; 8 x 100m avg <i><\/i><\/div>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Laps<\/span><i><\/i><\/div><div class=\"fld\"><span>Time<\/span><i><\/i><\/div><div class=\"fld\"><span>Pull-up dismounts<\/span><i><\/i><\/div><div class=\"fld\"><span>Burpees paid<\/span><i><\/i><\/div><\/div>"},{"kind":"run","title":"ESD: 4 x 2000m","src":"SASR 19.4","dress":"Vest 9kg, runners","inten":"RPE 9","venue":"Track / oval","plan":"4 x 2000m, 2 min rest","body":"<p class=\"rx\"><b>4 x 2000m<\/b>, 2 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route. Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Long Walk simulation, 6 hours","src":"Diary Day 6 / SASR 19.6","dress":"30kg pack, boots","inten":"Steady","venue":"Hill loop","plan":"Diary Long Walk: 30kg hill loop, 6 hours, task every 15 min","body":"<p class=\"rx\"><b>Long Walk simulation, 30kg, 6 hours<\/b> (Diary Day 6). Pack 30kg with two 10kg items (sandbags or plates) you can pull out. Find a loop of about 500m with a downhill one way and an uphill back. Lap at your own pace, silent: no music, no podcast (talking was banned). Every 15 min: drop the pack, take your water bottle, run 100-200m to a marker, do a station task, run back, re-shoulder. <span class=\"ad\">ADAPT<\/span> The diary does not say what the station assessments were. Rotate: 20 push-ups, 20 squats, 10 burpees, 1 min plank. After 8 laps pull one 10kg item; later pull both for a few laps, then put both back (diary pattern). At the end, before you stop, walk 2 more laps: the course director called 30km at the end of the day. <span class=\"ad\">ADAPT<\/span> SASR sets 35kg. Capped at 30kg.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Laps<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Stations done<\/span><i><\/i><\/div><div class=\"fld\"><span>Kit changes<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Low point (hour)<\/span><i><\/i><\/div><\/div>"},{"kind":"ph","title":"Push-up and pull-up ladder","src":"OA 2.5B","dress":"PT kit","inten":"Hard","venue":"Home gym","plan":"OA ladder: 245 push-ups, 49 pull-ups; 4 core rounds","body":"<p class=\"rx\"><b>Push-up and pull-up ladder<\/b> (Operator Actual 2.5B, \"Body Weight\"). Each rung: the push-ups, then the pull-ups, then the next rung. 245 push-ups and 49 pull-ups in all. Rest as you need and log the time. <span class=\"ad\">ADAPT<\/span> OA prints \"9 Push Ups\" on rung 2; the booklet reads it as 9 pull-ups, the pattern of the ladder. In place of SASR 19.7, the second march of the double (program choice).<\/p><table class=\"rxt c\"><tr><th>Rung<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr><tr><td>Push-ups<\/td><td>50<\/td><td>45<\/td><td>40<\/td><td>35<\/td><td>30<\/td><td>25<\/td><td>20<\/td><\/tr><tr><td>Pull-ups<\/td><td>10<\/td><td>9<\/td><td>8<\/td><td>7<\/td><td>6<\/td><td>5<\/td><td>4<\/td><\/tr><\/table><p class=\"rx\"><b>Then 4 rounds for time<\/b> (OA 2.5B): 20 hanging leg raises, 20 crunches, 1 min plank hold.<\/p>","log":"<div class=\"ticks\"><b>Rungs<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><\/div><div class=\"ticks\"><b>Core rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Ladder time<\/span><i><\/i><\/div><div class=\"fld\"><span>Core time<\/span><i><\/i><\/div><div class=\"fld\"><span>First broke on rung<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"SASR 19.5"}]},{"id":"S5","phase":"B","wk":21,"label":"Strength endurance","sub":"SASR Week 21 &middot; Long Walk + cadence push-ups","note":"SASR's 6 + 6 double drops to one march (program choice): the 6-hour Long Walk, then Operator Actual weighted cadence push-ups and pull-ups on D9. SASR 21.4 rest moves to D10.","dropped":"SASR 21.7 (30kg, 6 hours), the second march of the double (program choice).","hold":false,"days":[{"kind":"str","title":"Strength 1","src":"SASR 21.1","dress":"PT kit","inten":"85-90%","venue":"Home gym","plan":"5 x 3 at 85-90%: Front squat, DB bench press","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Explosive cable chop, high to low <span class=\"sb\">for med ball slam (7kg)<\/span><\/td><td>3 x 6<\/td><td>explosive<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Front squat<\/td><td>5 x 3<\/td><td>85-90%<\/td><td>4 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><\/tr><tr><td class=\"l\">DB bench press<\/td><td>5 x 3<\/td><td>85-90%<\/td><td>4 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><\/tr><tr><td class=\"l\">Seated row<\/td><td>3 x 15<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Face pull<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>","fin":{"key":"aero","title":"Low-impact cardio","src":"OA 2.4B, 4.4B, 8.3A","mins":"15","body":"<p class=\"rx\"><b>15 min<\/b> on the rower, cross-trainer or bike at 70% HRmax (about <span class=\"bpm\" data-p=\"70\">131<\/span> bpm). <span class=\"ad\">ADAPT<\/span> OA runs 15 min on each of the three machines; the booklet takes one block and rotates the machine. Used on heavy 5 x 3 days, when the strength work runs long.<\/p><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Machine<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg HR<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>","plan":"Low-impact cardio (~15 min)"}},{"kind":"run","title":"MAS 30: 3 x 8 at 120%","src":"SASR 21.2","dress":"Vest 9kg, runners","inten":"120% MAS","venue":"Oval","plan":"MAS 30 at 120%, 3 x 8","body":"<p class=\"rx\"><b>MAS 30 at 120%: 3 x 8<\/b>, 4 min between sets. Cone your distance from your 1600m time trial (A10 D2) using the strip below. Run it in 30 sec, rest 30 sec in place, run back to the start cone. One set of 8 takes 8 min (SASR). Vest 9kg replaces SASR webbing (PO).<\/p><table class=\"mstrip\"><tr><th>1600m<\/th><td>4:30<\/td><td>4:45<\/td><td>5:00<\/td><td>5:15<\/td><td>5:29<\/td><td>5:44<\/td><td>5:57<\/td><td>6:11<\/td><td>6:26<\/td><td>6:42<\/td><td>7:00<\/td><td>7:19<\/td><td>7:40<\/td><td>8:00<\/td><\/tr><tr><th>30 sec m<\/th><td><b>213<\/b><\/td><td><b>202<\/b><\/td><td><b>192<\/b><\/td><td><b>183<\/b><\/td><td><b>175<\/b><\/td><td><b>167<\/b><\/td><td><b>161<\/b><\/td><td><b>155<\/b><\/td><td><b>149<\/b><\/td><td><b>143<\/b><\/td><td><b>137<\/b><\/td><td><b>131<\/b><\/td><td><b>125<\/b><\/td><td><b>120<\/b><\/td><\/tr><\/table><p class=\"lgnote\">Selected rows of the SASR MAS table (30 sec / 120% column). Between rows: take the slower row, or work it out: 1600 / your 1600m seconds x 30 x 1.2.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>My 1600m time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance (m)<\/span><i><\/i><\/div><\/div><table class=\"lg\"><tr><th class=\"l\">Set<\/th><th>Reps on time<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">Set 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 21.3","dress":"PT kit","inten":"85-90%","venue":"Home gym","plan":"5 x 3 at 85-90%: Rack pull, Back squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Rack pull<\/td><td>5 x 3<\/td><td>85-90%<\/td><td>4 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><\/tr><tr><td class=\"l\">Back squat<\/td><td>5 x 3<\/td><td>85-90%<\/td><td>4 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><\/tr><tr><td class=\"l\">Push press<\/td><td>3 x 15<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"diary","title":"Jerry carry","src":"Diary Day 2","dress":"PT kit","inten":"Hard","venue":"Driveway / grass","plan":"Farmers carry 2 x 24kg 35 min, bear hug 15 min","body":"<p class=\"rx\"><b>Jerry carry<\/b> (Diary Day 2: 2 x 24L jerry cans on a 650m airstrip for 7-8 hours, self-managed and silent). Mark a 50m strip with a marker every 10m. <b>Part 1, 35 min:<\/b> farmers carry, a 24kg DB in each hand. Set down only at a marker, and never more than two markers apart (diary rule). One 50m length = 1 point. <b>Part 2, 15 min:<\/b> one DB hugged to the chest (bear hug), one marker at a time (the course switched after about 15 laps). 24L of water weighs 24kg; a full can weighs more. Two water-filled jerry cans make it exact. <span class=\"ad\">ADAPT<\/span> Durations are booklet figures, built up across Phase B.<\/p><div class=\"swap\"><b>Fitness test still ahead? Do this instead, at the pool.<\/b> Boots and overalls: 2 x 15m underwater (3 min apart, spotter on deck, no hyperventilating), 2 brick dives, 3 min tread water, 100m for time. Then swimmers: 8 x 100m, 60 sec rest (SF 3.7 / 5.7 set). <span class=\"ad\">ADAPT<\/span> Booklet session from the TRG water items and an SF swim set. Log: 100m B&amp;O <i><\/i> &nbsp; 8 x 100m avg <i><\/i><\/div>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Part 1 points<\/span><i><\/i><\/div><div class=\"fld\"><span>Part 2 points<\/span><i><\/i><\/div><div class=\"fld\"><span>Grip failed at (min)<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"gpp","title":"GPP: easy cross-training (Week 21)","src":"SASR 21.5","dress":"PT kit","inten":"Easy","venue":"","plan":"Bike, treadmill, rower: 10 min each, easy","body":"<p class=\"rx\">Easy pace, continuous. SASR: spin bike 10 min, treadmill 10 min, swim 500m. <span class=\"ad\">ADAPT<\/span> Rower 10 min replaces the 500m swim: the cycle already has a pool session.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Spin bike<\/td><td>10 min<\/td><td>easy<\/td><\/tr><tr><td class='l'>Treadmill<\/td><td>10 min<\/td><td>easy<\/td><\/tr><tr><td class='l'>Rower (for 500m swim)<\/td><td>10 min<\/td><td>easy<\/td><\/tr><\/table>","log":"<div class=\"flds c4\"><div class=\"fld\"><span>Bike km<\/span><i><\/i><\/div><div class=\"fld\"><span>Treadmill km<\/span><i><\/i><\/div><div class=\"fld\"><span>Rower m<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg HR<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Long Walk simulation, 6 hours","src":"Diary Day 6 / SASR 21.6","dress":"30kg pack, boots","inten":"Steady","venue":"Hill loop","plan":"Diary Long Walk: 30kg hill loop, 6 hours, task every 15 min","body":"<p class=\"rx\"><b>Long Walk simulation, 30kg, 6 hours<\/b> (Diary Day 6). Pack 30kg with two 10kg items (sandbags or plates) you can pull out. Find a loop of about 500m with a downhill one way and an uphill back. Lap at your own pace, silent: no music, no podcast (talking was banned). Every 15 min: drop the pack, take your water bottle, run 100-200m to a marker, do a station task, run back, re-shoulder. <span class=\"ad\">ADAPT<\/span> The diary does not say what the station assessments were. Rotate: 20 push-ups, 20 squats, 10 burpees, 1 min plank. After 8 laps pull one 10kg item; later pull both for a few laps, then put both back (diary pattern). At the end, before you stop, walk 2 more laps: the course director called 30km at the end of the day. <span class=\"ad\">ADAPT<\/span> SASR sets 35kg. Capped at 30kg.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Laps<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Stations done<\/span><i><\/i><\/div><div class=\"fld\"><span>Kit changes<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Low point (hour)<\/span><i><\/i><\/div><\/div>"},{"kind":"ph","title":"Weighted cadence push-ups + pull-ups","src":"OA 8.2A","dress":"PT kit","inten":"Max","venue":"Home gym","plan":"OA cadence push-ups (plate, then bodyweight), 4 x max weighted pull-ups","body":"<p class=\"rx\"><b>Weighted cadence push-ups<\/b> (Operator Actual 8.2A), 3-second cadence, 2 min rest between sets: max push-ups with a 10-20kg plate on your back, then max with the plate again (reach 55% or more of the first set), then max at bodyweight, then max at bodyweight again (55% or more of the third set). <b>Then 4 rounds of max weighted pull-ups<\/b>, 5-20kg on the belt (OA 8.2A, also OA 5.2B). <span class=\"ad\">ADAPT<\/span> No one to load a plate? The vest at 13kg (all four plates) stands in. OA 8.2A ends with a squat, sit-up and lunge metcon; the booklet drops it so your legs recover from the 6-hour march. In place of SASR 21.7, the second march of the double (program choice).<\/p><p class=\"small\">Cadence: 3 seconds per rep. Operator Actual prescribes a \"3 sec Cadence\" without defining it; the booklet reads it as one rep every 3 seconds. Run it off a metronome app and use the same beat for every cadence session and test.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Set<\/th><th>Reps<\/th><\/tr><tr><td class=\"l\">Push-ups 1 (plate)<\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Push-ups 2 (plate, 55%+)<\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Push-ups 3 (bodyweight)<\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Push-ups 4 (bodyweight, 55%+)<\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Heaves 1 (weighted)<\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Heaves 2 (weighted)<\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Heaves 3 (weighted)<\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Heaves 4 (weighted)<\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table><div class=\"flds c2\"><div class=\"fld\"><span>Push-up plate / vest kg<\/span><i><\/i><\/div><div class=\"fld\"><span>Pull-up belt kg<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"SASR 21.4"}]},{"id":"S6","phase":"B","wk":22,"label":"Strength endurance","sub":"SASR Week 22 &middot; unload strength","note":"Strength unloads. One march (program choice): the forced march into 6 hours, then Operator Actual low-impact cardio on D9. SASR leaves the Week 22 GPP sheet blank: the diary Accumulator fills it.","dropped":"SASR 22.7 (30kg, 4 hours), the second march (program choice).","hold":false,"days":[{"kind":"str","title":"Strength 1","src":"SASR 22.1","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"2 x 10 at 65-75%: Front squat, DB bench press","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p><p class=\"flag\">SASR lists no calf raise in Week 22.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Explosive cable chop, high to low <span class=\"sb\">for med ball slam (7kg)<\/span><\/td><td>3 x 6<\/td><td>explosive<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Front squat<\/td><td>2 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">DB bench press<\/td><td>2 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Seated row<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Face pull<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"run","title":"MAS 30: 3 x 8 at 120%","src":"SASR 22.2","dress":"Vest 9kg, runners","inten":"120% MAS","venue":"Oval","plan":"MAS 30 at 120%, 3 x 8","body":"<p class=\"rx\"><b>MAS 30 at 120%: 3 x 8<\/b>, 4 min between sets. Cone your distance from your 1600m time trial (A10 D2) using the strip below. Run it in 30 sec, rest 30 sec in place, run back to the start cone. One set of 8 takes 8 min (SASR). Vest 9kg replaces SASR webbing (PO).<\/p><table class=\"mstrip\"><tr><th>1600m<\/th><td>4:30<\/td><td>4:45<\/td><td>5:00<\/td><td>5:15<\/td><td>5:29<\/td><td>5:44<\/td><td>5:57<\/td><td>6:11<\/td><td>6:26<\/td><td>6:42<\/td><td>7:00<\/td><td>7:19<\/td><td>7:40<\/td><td>8:00<\/td><\/tr><tr><th>30 sec m<\/th><td><b>213<\/b><\/td><td><b>202<\/b><\/td><td><b>192<\/b><\/td><td><b>183<\/b><\/td><td><b>175<\/b><\/td><td><b>167<\/b><\/td><td><b>161<\/b><\/td><td><b>155<\/b><\/td><td><b>149<\/b><\/td><td><b>143<\/b><\/td><td><b>137<\/b><\/td><td><b>131<\/b><\/td><td><b>125<\/b><\/td><td><b>120<\/b><\/td><\/tr><\/table><p class=\"lgnote\">Selected rows of the SASR MAS table (30 sec / 120% column). Between rows: take the slower row, or work it out: 1600 / your 1600m seconds x 30 x 1.2.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>My 1600m time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance (m)<\/span><i><\/i><\/div><\/div><table class=\"lg\"><tr><th class=\"l\">Set<\/th><th>Reps on time<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">Set 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 22.3","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"2 x 10 at 65-75%: Rack pull, Back squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Rack pull<\/td><td>2 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Back squat<\/td><td>2 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Push press<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"diary","title":"Devil half-mile","src":"Diary Day 1","dress":"PT kit","inten":"Hard","venue":"Work gym oval / grass","plan":"40m lines: burpees, broad jumps, TB overhead walk, bear crawl, lunges to 800m","body":"<p class=\"rx\"><b>Devil half-mile<\/b> (Diary Day 1). Two lines 40m apart. Every time you cross the start line: 5 burpees. Then out and back with each movement in turn: broad jumps, torsion bar held overhead (walking), bear crawl (forward out, reverse back), walking lunges. Keep cycling the movements until you have covered 800m: 10 out-and-backs, 50 burpees. The course ran this after 5 x 1000m, a pack march and Armageddon.<\/p><div class=\"swap\"><b>Fitness test still ahead? Do this instead, at the pool.<\/b> Boots and overalls: 2 x 15m underwater (3 min apart, spotter on deck, no hyperventilating), 2 brick dives, 3 min tread water, 100m for time. Then swimmers: 8 x 100m, 60 sec rest (SF 3.7 / 5.7 set). <span class=\"ad\">ADAPT<\/span> Booklet session from the TRG water items and an SF swim set. Log: 100m B&amp;O <i><\/i> &nbsp; 8 x 100m avg <i><\/i><\/div>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Out-and-backs<\/span><i><\/i><\/div><div class=\"fld\"><span>Slowest movement<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"diary","title":"Accumulator","src":"Diary Day 2 / SASR 22.5","dress":"PT kit","inten":"Hard","venue":"","plan":"3 x (10 min AMRAP push-ups, pack squats, sit-ups + 1 min max bike)","body":"<p class=\"rx\"><b>Accumulator<\/b> (Diary Day 2). Round = 5 push-ups, 10 squats holding a 20kg pack (sandbag on course), 15 butterfly sit-ups. The course scored 1 point a round and 1 point a calorie on the bike. <span class=\"ad\">ADAPT<\/span> Solo format: 3 blocks of 10 min AMRAP, each straight into 1 min max calories on the bike, 2 min rest between blocks. Block 3: stand on the bike (course: standing, max damper). No calorie display: log distance.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Block<\/th><th>Rounds<\/th><th>Bike cal / m<\/th><\/tr><tr><td class=\"l\">Block 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Block 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Block 3 (standing)<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Forced march + long march, 30kg, 6 hours","src":"Diary Day 4 / SASR 22.6","dress":"30kg pack, boots","inten":"Max","venue":"Measured route","plan":"Forced-march splits to 15km, then steady to 6 hours","body":"<p class=\"rx\"><b>Forced march, 30kg.<\/b> Diary Day 4: max effort, catch the bus at 5km inside 40 min; at 40 min the bus moves 1km on and you have 10 min to reach it; repeat to the 15km cut-off. Train it against the clock, <b>walking only<\/b>: hit every split below. <span class=\"ad\">ADAPT<\/span> The diary does not say walk-only. The booklet makes it walk-only (program choice), like the fitness test march, and the MARSOC prep guide advises against running under a pack in training. SASR 22.6: 30kg, 6 hours. After 15km, carry on at a steady pace to 6:00 total.<\/p>","log":"<table class=\"lg\">\n<tr><th class=\"l\">Mark<\/th><th>Target<\/th><th>Actual<\/th><th>Made it<\/th><\/tr><tr><td class=\"l\">5km<\/td><td>0:40:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">6km<\/td><td>0:50:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">7km<\/td><td>1:00:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">8km<\/td><td>1:10:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">9km<\/td><td>1:20:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">10km<\/td><td>1:30:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">11km<\/td><td>1:40:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">12km<\/td><td>1:50:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">13km<\/td><td>2:00:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">14km<\/td><td>2:10:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><tr><td class=\"l\">15km<\/td><td>2:20:00<\/td><td style=\"height:4.3mm\"><\/td><td><\/td><\/tr><\/table><div class=\"flds c2\"><div class=\"fld\"><span>Total distance at 6:00<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><\/div>"},{"kind":"cardio","title":"Low-impact cardio, 45 min","src":"OA 2.4B","dress":"PT kit","inten":"70% HRmax","venue":"Home gym","plan":"15 min each rower, elliptical, bike at 70% HRmax","body":"<p class=\"rx\"><b>Low-impact cardio, 45 min<\/b> (Operator Actual 2.4B): 15 min rower, 15 min elliptical (OA: cross trainer), 15 min bike, all at 70% HRmax, about <span class=\"bpm\" data-p=\"70\">131<\/span> bpm. <span class=\"ad\">ADAPT<\/span> OA follows it with 10 pool rounds (100m swim, push-ups, sit-ups, squats); the booklet drops them so your legs recover after the forced march. In place of SASR 22.7, the second march (program choice).<\/p>","log":"<div class=\"flds c4\"><div class=\"fld\"><span>Rower m<\/span><i><\/i><\/div><div class=\"fld\"><span>Elliptical km<\/span><i><\/i><\/div><div class=\"fld\"><span>Bike km<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg HR<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"SASR 22.4"}]},{"id":"S7","phase":"B","wk":23,"label":"Strength endurance","sub":"SASR Week 23 &middot; torsion bar","note":"Strength 1 turns into the torsion bar circuit. SASR 23.1 also has a morning swim (5 x 100m); one session a day drops it.","dropped":"SASR 23.1 am swim (5 x 100m, RPE 7).","hold":false,"days":[{"kind":"str","title":"Strength 1: torsion bar circuit","src":"SASR 23.1 pm","dress":"PT kit","inten":"RPE 7","venue":"Work gym (torsion bar)","plan":"10 rounds TB circuit (press, front squat, upright row, lunge, get-up)","body":"<p class=\"rx\">Torsion bar circuit, 10 rounds at RPE 7. Work down the list, rest 1 min, repeat. SASR prints this session in its GPP layout (sets column = rounds); the booklet runs it as a circuit. Diary: the 2026 course ran torsion bar curls to 150 reps and torsion bar complexes between cones.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps<\/th><th>Load<\/th><\/tr><tr><td class='l'>Military press<\/td><td>20<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Front squat<\/td><td>10<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Upright row<\/td><td>20<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Lunge<\/td><td>10<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Get-up <span class='sb'>SASR lists \"Get Up\" with no load; the booklet reads it as lie flat, stand up<\/span><\/td><td>12<\/td><td>Bodyweight<\/td><\/tr><\/table>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><span>9<\/span><span>10<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Broke on (exercise / round)<\/span><i><\/i><\/div><\/div>","fin":{"key":"core","title":"Core rounds","src":"OA 2.5B, 3.2A, 4.1A","mins":"10-12","body":"<p class=\"rx\"><b>4 rounds<\/b> for time: 20 hanging leg raises, 20 crunches, 1 min plank. As written in OA. The 2026 course punished cadence breaks with planks and static holds.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Hanging leg raises<\/td><td>20<\/td><td>-<\/td><\/tr><tr><td class='l'>Crunches<\/td><td>20<\/td><td>-<\/td><\/tr><tr><td class='l'>Plank<\/td><td>1 min<\/td><td>-<\/td><\/tr><\/table><p class=\"small\">Finisher: straight after the strength work, at GPP effort (RPE 6-7, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm). Skip it when your morning RHR sits above baseline or the strength work ran long. SASR warns that extra resistance work raises overtraining risk, so the finisher is the first thing to cut.<\/p>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>","plan":"Core rounds (~10-12 min)"}},{"kind":"run","title":"MAS 15: 4 x 10 at 120%","src":"SASR 23.2","dress":"PT kit","inten":"120% MAS","venue":"Oval","plan":"MAS 15 at 120%, 4 x 10","body":"<p class=\"rx\"><b>MAS 15 at 120%: 4 x 10<\/b>, 2 min between sets. Cone your distance from your 1600m time trial (A10 D2) using the strip below. Run it in 15 sec, rest 15 sec in place, run back to the start cone. One set of 10 takes 5 min (SASR).<\/p><table class=\"mstrip\"><tr><th>1600m<\/th><td>4:30<\/td><td>4:45<\/td><td>5:00<\/td><td>5:15<\/td><td>5:29<\/td><td>5:44<\/td><td>5:57<\/td><td>6:11<\/td><td>6:26<\/td><td>6:42<\/td><td>7:00<\/td><td>7:19<\/td><td>7:40<\/td><td>8:00<\/td><\/tr><tr><th>15 sec m<\/th><td><b>107<\/b><\/td><td><b>101<\/b><\/td><td><b>96<\/b><\/td><td><b>91<\/b><\/td><td><b>88<\/b><\/td><td><b>84<\/b><\/td><td><b>81<\/b><\/td><td><b>78<\/b><\/td><td><b>75<\/b><\/td><td><b>72<\/b><\/td><td><b>69<\/b><\/td><td><b>66<\/b><\/td><td><b>63<\/b><\/td><td><b>60<\/b><\/td><\/tr><\/table><p class=\"lgnote\">Selected rows of the SASR MAS table (15 sec / 120% column). Between rows: take the slower row, or work it out: 1600 / your 1600m seconds x 15 x 1.2.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>My 1600m time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance (m)<\/span><i><\/i><\/div><\/div><table class=\"lg\"><tr><th class=\"l\">Set<\/th><th>Reps on time<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">Set 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 4<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 23.3","dress":"PT kit","inten":"65-75%","venue":"Home gym","plan":"3 x 10 at 65-75%: Romanian deadlift, Goblet squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Romanian deadlift<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Goblet squat<\/td><td>3 x 10<\/td><td>65-75%<\/td><td>2 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Seated press<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"diary","title":"Deck of cards","src":"Diary Day 4","dress":"PT kit","inten":"Max","venue":"","plan":"Full deck: push-ups, squats, burpees, sit-ups","body":"<p class=\"rx\"><b>Deck of cards<\/b> (Diary Day 4, about 30 min). Shuffle, draw a card, do the reps at max effort, draw again. Number cards = face value, J / Q / K = 10, ace = 11. <span class=\"ad\">ADAPT<\/span> The diary does not list the movements. Suits: spades push-ups, hearts squats, diamonds burpees, clubs sit-ups. A full deck = 95 reps of each.<\/p><div class=\"swap\"><b>Fitness test still ahead? Do this instead, at the pool.<\/b> Boots and overalls: 2 x 15m underwater (3 min apart, spotter on deck, no hyperventilating), 2 brick dives, 3 min tread water, 100m for time. Then swimmers: 8 x 100m, 60 sec rest (SF 3.7 / 5.7 set). <span class=\"ad\">ADAPT<\/span> Booklet session from the TRG water items and an SF swim set. Log: 100m B&amp;O <i><\/i> &nbsp; 8 x 100m avg <i><\/i><\/div>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Time for the deck<\/span><i><\/i><\/div><div class=\"fld\"><span>Cards left at 30 min<\/span><i><\/i><\/div><div class=\"fld\"><span>Hardest suit<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"gpp","title":"GPP circuit (Week 23)","src":"SASR 23.5","dress":"PT kit","inten":"RPE 6-7","venue":"Home gym","plan":"10 rounds: Chin-ups; Burpees; Squats; Push-ups","body":"<p class=\"rx\">10 rounds, 1 min rest between rounds. Circuit: work down the list, rest, repeat. RPE 6-7 (70-80% HRmax, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm): a constant hard pace, never to failure. Most sessions run 20-40 min with rest (SASR).<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Chin-ups<\/td><td>8<\/td><td>-<\/td><\/tr><tr><td class='l'>Burpees<\/td><td>10<\/td><td>-<\/td><\/tr><tr><td class='l'>Squats<\/td><td>20<\/td><td>-<\/td><\/tr><tr><td class='l'>Push-ups<\/td><td>15<\/td><td>-<\/td><\/tr><\/table>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><span>9<\/span><span>10<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Long Walk simulation, 6 hours","src":"Diary Day 6 / SASR 23.6","dress":"30kg pack, boots","inten":"Steady","venue":"Hill loop","plan":"Diary Long Walk: 30kg hill loop, 6 hours, task every 15 min","body":"<p class=\"rx\"><b>Long Walk simulation, 30kg, 6 hours<\/b> (Diary Day 6). Pack 30kg with two 10kg items (sandbags or plates) you can pull out. Find a loop of about 500m with a downhill one way and an uphill back. Lap at your own pace, silent: no music, no podcast (talking was banned). Every 15 min: drop the pack, take your water bottle, run 100-200m to a marker, do a station task, run back, re-shoulder. <span class=\"ad\">ADAPT<\/span> The diary does not say what the station assessments were. Rotate: 20 push-ups, 20 squats, 10 burpees, 1 min plank. After 8 laps pull one 10kg item; later pull both for a few laps, then put both back (diary pattern). At the end, before you stop, walk 2 more laps: the course director called 30km at the end of the day. <span class=\"ad\">ADAPT<\/span> SASR sets 35kg. Capped at 30kg.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Laps<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Stations done<\/span><i><\/i><\/div><div class=\"fld\"><span>Kit changes<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Low point (hour)<\/span><i><\/i><\/div><\/div>"},{"kind":"diary","title":"Jerry carry + static holds","src":"Diary Day 2","dress":"PT kit","inten":"Hard","venue":"Driveway / grass","plan":"Farmers carry 2 x 24kg 50 min, bear hug 20 min, holds x 3","body":"<p class=\"rx\"><b>Jerry carry<\/b> (Diary Day 2: 2 x 24L jerry cans on a 650m airstrip for 7-8 hours, self-managed and silent). Mark a 50m strip with a marker every 10m. <b>Part 1, 50 min:<\/b> farmers carry, a 24kg DB in each hand. Set down only at a marker, and never more than two markers apart (diary rule). One 50m length = 1 point. <b>Part 2, 20 min:<\/b> one DB hugged to the chest (bear hug), one marker at a time (the course switched after about 15 laps). 24L of water weighs 24kg; a full can weighs more. Two water-filled jerry cans make it exact. Finish with the <b>static holds box<\/b>, 3 rounds: high plank 2 min, side plank 1 min each side, bird dog 1 min each side, wall sit 2 min; 30 sec between stations (Diary Day 2). <span class=\"ad\">ADAPT<\/span> Durations are booklet figures, built up across Phase B.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Part 1 points<\/span><i><\/i><\/div><div class=\"fld\"><span>Part 2 points<\/span><i><\/i><\/div><div class=\"fld\"><span>Grip failed at (min)<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"run","title":"ESD: 2 x 3.2km","src":"SASR 23.4","dress":"Vest 9kg, boots on rep 1","inten":"RPE 9","venue":"Track / oval","plan":"2 x 3.2km, 4 min rest","body":"<p class=\"rx\"><b>2 x 3.2km<\/b>, 4 min rest. Every rep at RPE 9: 90% HRmax, about <span class=\"bpm\" data-p=\"90\">168<\/span> bpm. Same effort on every rep, rest between (SASR). Track, oval or a measured flat route. Boots on rep 1 only, then runners. SASR: running in boots for long periods raises impact load at the ankle, knee and hip. Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p><p class=\"rx\">SASR 23.4: rep 1 at 90% in webbing (vest 9kg), rep 2 at 80% in cams / runners (overalls, runners).<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"}]},{"id":"S8","phase":"B","wk":25,"label":"Strength endurance","sub":"SASR Week 25 &middot; reduce","note":"Volume comes down. D10 runs the full Course Day 1 simulation, 11-20 days before the course.","dropped":"SASR Week 24 is dropped to fit the 10-day cycle (see the planner).","hold":false,"days":[{"kind":"str","title":"Strength 1: torsion bar circuit","src":"SASR 25.1","dress":"PT kit","inten":"RPE 8","venue":"Work gym (torsion bar)","plan":"8 rounds TB circuit (press, front squat, upright row, lunge, get-up)","body":"<p class=\"rx\">Torsion bar circuit, 8 rounds at RPE 8. Work down the list, rest 1 min, repeat. SASR prints this session in its GPP layout (sets column = rounds); the booklet runs it as a circuit. Diary: the 2026 course ran torsion bar curls to 150 reps and torsion bar complexes between cones.<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps<\/th><th>Load<\/th><\/tr><tr><td class='l'>Military press<\/td><td>20<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Front squat<\/td><td>10<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Upright row<\/td><td>20<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Lunge<\/td><td>10<\/td><td>Torsion bar<\/td><\/tr><tr><td class='l'>Get-up <span class='sb'>SASR lists \"Get Up\" with no load; the booklet reads it as lie flat, stand up<\/span><\/td><td>12<\/td><td>Bodyweight<\/td><\/tr><\/table>","l
