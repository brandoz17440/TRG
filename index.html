og":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Broke on (exercise / round)<\/span><i><\/i><\/div><\/div>"},{"kind":"run","title":"ESD: 2 x 1000m","src":"SASR 25.2","dress":"Vest 9kg, runners","inten":"RPE 8","venue":"Track / oval","plan":"2 x 1000m, 2 min rest","body":"<p class=\"rx\"><b>2 x 1000m<\/b>, 2 min rest. Every rep at RPE 8. Same effort on every rep (SASR). Vest 9kg replaces SASR webbing (PO); the 3.2km test sets PO at 8kg and the vest plates build 9kg.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Rep<\/th><th>Time<\/th><th>Avg HR<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"str","title":"Strength 2","src":"SASR 25.3","dress":"PT kit","inten":"85-90%","venue":"Home gym","plan":"5 x 3 at 85-90%: Romanian deadlift, Goblet squat","body":"<p class=\"rx\">Movement prep 5-10 min, then 2-3 warm-up sets before each lift (not listed). Work kg = % x 1RM: write your 1RM in the 1RM box and carry it forward each cycle. No 1RM yet: estimate from one clean set (SASR load table: 15 reps = 65%, 12 = 70%, 10 = 75%, 8 = 80%, 5 = 85%, 3 = 90%), e.g. 10 reps at 80kg = 80 / 0.75 = 107kg. No set to failure: each set is a run of single, clean reps. Add 2-5% where the bar moved well last time. DB lifts: past 40kg, use 40kg and lower over 3 sec.<\/p>","log":"<table class=\"st\"><tr><th class=\"l\">Exercise<\/th><th>Sets x reps<\/th><th>Load<\/th><th>Rest<\/th><th class=\"kg\">1RM<\/th><th class=\"kg\">kg<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td class=\"l\">Broad jump<\/td><td>3 x 6<\/td><td>max<\/td><td>1 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Romanian deadlift<\/td><td>5 x 3<\/td><td>85-90%<\/td><td>4 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><\/tr><tr><td class=\"l\">Goblet squat<\/td><td>5 x 3<\/td><td>85-90%<\/td><td>4 min<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><\/tr><tr><td class=\"l\">Seated press<\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Single-leg DB RDL, each leg <span class=\"sb\">for GHD / Nordic raise<\/span><\/td><td>3 x 12<\/td><td>65-75%<\/td><td>60 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><tr><td class=\"l\">Calf raise (leg press or DB)<\/td><td>3 x 20<\/td><td>65-75%<\/td><td>45 sec<\/td><td class=\"kg\"><\/td><td class=\"kg\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"w\"><\/td><td class=\"x\"><\/td><td class=\"x\"><\/td><\/tr><\/table><p class=\"lgnote\">Write the work kg, then reps done in each set box. Shaded boxes: no set.<\/p>"},{"kind":"diary","title":"Armageddon","src":"Diary Day 1","dress":"PT kit","inten":"Hard","venue":"Work gym (torsion bar)","plan":"TB curls to 150 on cadence, 3 x max cadence push-ups","body":"<p class=\"rx\"><b>Armageddon<\/b> (Diary Day 1). Torsion bar bicep curls to a cadence, building to <b>150<\/b> reps. Cadence breaks: drop to a plank for 30 sec, then pick the count back up. <span class=\"ad\">ADAPT<\/span> On course the DS held candidates in the plank; the 30 sec is the booklet figure. Then cadence push-ups: 3 sets of max, 2 min rest. <span class=\"ad\">ADAPT<\/span> The diary gives no set count.<\/p><p class=\"small\">Cadence: 3 seconds per rep. Operator Actual prescribes a \"3 sec Cadence\" without defining it; the booklet reads it as one rep every 3 seconds. Run it off a metronome app and use the same beat for every cadence session and test.<\/p><div class=\"swap\"><b>Fitness test still ahead? Do this instead, at the pool.<\/b> Boots and overalls: 2 x 15m underwater (3 min apart, spotter on deck, no hyperventilating), 2 brick dives, 3 min tread water, 100m for time. Then swimmers: 8 x 100m, 60 sec rest (SF 3.7 / 5.7 set). <span class=\"ad\">ADAPT<\/span> Booklet session from the TRG water items and an SF swim set. Log: 100m B&amp;O <i><\/i> &nbsp; 8 x 100m avg <i><\/i><\/div>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Curls done<\/span><i><\/i><\/div><div class=\"fld\"><span>Cadence breaks<\/span><i><\/i><\/div><div class=\"fld\"><span>Push-ups set 1<\/span><i><\/i><\/div><div class=\"fld\"><span>Push-ups set 2<\/span><i><\/i><\/div><div class=\"fld\"><span>Push-ups set 3<\/span><i><\/i><\/div><div class=\"fld\"><span>Holds: where it broke<\/span><i><\/i><\/div><\/div>"},{"kind":"gpp","title":"GPP circuit (Week 25)","src":"SASR 25.5","dress":"PT kit","inten":"RPE 6-7","venue":"Home gym","plan":"8 rounds: Chin-ups; Burpees; Pack ground-to-shoulder; Push-ups","body":"<p class=\"rx\">8 rounds, 1 min rest between rounds. Circuit: work down the list, rest, repeat. RPE 6-7 (70-80% HRmax, <span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span> bpm): a constant hard pace, never to failure. Most sessions run 20-40 min with rest (SASR).<\/p><table class=\"rxt c\"><tr><th class=\"l\">Exercise<\/th><th>Reps / dist<\/th><th>Load<\/th><\/tr><tr><td class='l'>Chin-ups<\/td><td>8<\/td><td>-<\/td><\/tr><tr><td class='l'>Burpees<\/td><td>10<\/td><td>-<\/td><\/tr><tr><td class='l'>Pack ground-to-shoulder <span class='sb'>for tyre flip<\/span><\/td><td>10<\/td><td>20kg pack<\/td><\/tr><tr><td class='l'>Push-ups<\/td><td>15<\/td><td>-<\/td><\/tr><\/table><p class=\"rx\"><span class=\"ad\">ADAPT<\/span> No tyre: lift a 20kg pack from the floor to one shoulder, alternate shoulders. Same hinge-and-drive pattern, and the diary had teams lifting a tyre overhead.<\/p>","log":"<div class=\"ticks\"><b>Rounds<\/b><span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span><span>7<\/span><span>8<\/span><\/div><div class=\"flds c2\"><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Notes<\/span><i><\/i><\/div><\/div>"},{"kind":"rest","src":"Your rule"},{"kind":"rest","src":"Your rule"},{"kind":"elc","title":"Pack march: 28kg, 2 hours","src":"SASR 25.6","dress":"28kg pack, boots","inten":"Steady","venue":"Bush / gravel","plan":"28kg, 2 hours; first 5km at 8:00/km","body":"<p class=\"rx\"><b>28kg, 2 hours.<\/b> First 5km at 8:00/km or faster, walking only: the TRG test standard (5km in under 40 min). The 2026 course forced march asked for the same 5km in 40 min under about 30kg. Then a steady pace to the finish. Load = total pack weight (SASR loads cover pack and webbing). Grass, gravel or bush tracks (SF). Drink before, during and after; eat within 30 min after (SF).<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>First 5km split<\/span><i><\/i><\/div><div class=\"fld\"><span>Total time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg pace / km<\/span><i><\/i><\/div><div class=\"fld\"><span>Hotspots / feet<\/span><i><\/i><\/div><div class=\"fld\"><span>Water / food<\/span><i><\/i><\/div><\/div>"},{"kind":"run","title":"MAS 15: 3 x 10 at 120%","src":"SASR 25.4","dress":"PT kit","inten":"120% MAS","venue":"Oval","plan":"MAS 15 at 120%, 3 x 10","body":"<p class=\"rx\"><b>MAS 15 at 120%: 3 x 10<\/b>, 3 min between sets. Cone your distance from your 1600m time trial (A10 D2) using the strip below. Run it in 15 sec, rest 15 sec in place, run back to the start cone. One set of 10 takes 5 min (SASR).<\/p><table class=\"mstrip\"><tr><th>1600m<\/th><td>4:30<\/td><td>4:45<\/td><td>5:00<\/td><td>5:15<\/td><td>5:29<\/td><td>5:44<\/td><td>5:57<\/td><td>6:11<\/td><td>6:26<\/td><td>6:42<\/td><td>7:00<\/td><td>7:19<\/td><td>7:40<\/td><td>8:00<\/td><\/tr><tr><th>15 sec m<\/th><td><b>107<\/b><\/td><td><b>101<\/b><\/td><td><b>96<\/b><\/td><td><b>91<\/b><\/td><td><b>88<\/b><\/td><td><b>84<\/b><\/td><td><b>81<\/b><\/td><td><b>78<\/b><\/td><td><b>75<\/b><\/td><td><b>72<\/b><\/td><td><b>69<\/b><\/td><td><b>66<\/b><\/td><td><b>63<\/b><\/td><td><b>60<\/b><\/td><\/tr><\/table><p class=\"lgnote\">Selected rows of the SASR MAS table (15 sec / 120% column). Between rows: take the slower row, or work it out: 1600 / your 1600m seconds x 15 x 1.2.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>My 1600m time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance (m)<\/span><i><\/i><\/div><\/div><table class=\"lg\"><tr><th class=\"l\">Set<\/th><th>Reps on time<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">Set 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 3<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},{"kind":"diary","title":"Course Day 1 simulation","src":"Diary Day 1","dress":"PT kit","inten":"Max","venue":"Work gym + oval","plan":"Diary Day 1: 1000m repeats, pack marches, Armageddon, Devil half-mile","body":"<p class=\"rx\"><b>Course Day 1 simulation<\/b> (Diary Day 1, the PT block). Torsion bar and pack needed: do it at the work gym, or swap the torsion bar for a pair of 6kg DBs. About 2.5 hours. No rest beyond what is listed.<\/p><table class=\"rxt\"><tr><th class=\"l\">Serial<\/th><th>Content<\/th><th>Source<\/th><\/tr><tr><td class=\"l\">1. Warm-up<\/td><td>10 min: burpees and mobility <span class=\"sb\">the diary names \"TRG warm-up 1 and 2\" without detail<\/span><\/td><td>Diary / ADAPT<\/td><\/tr><tr><td class=\"l\">2. 1000m repeats<\/td><td>2 min rest, cut-off 5:00; run 5, decide on a 6th<\/td><td>Diary<\/td><\/tr><tr><td class=\"l\">3. Pack march<\/td><td>1km, 21kg pack<\/td><td>Diary<\/td><\/tr><tr><td class=\"l\">4. Armageddon<\/td><td>Torsion bar curls on cadence to 150, plank on a break, then cadence push-ups <span class=\"sb\">30 sec plank and 3 x max push-ups are booklet figures<\/span><\/td><td>Diary / ADAPT<\/td><\/tr><tr><td class=\"l\">5. Pack march<\/td><td>1km, 21kg pack<\/td><td>Diary<\/td><\/tr><tr><td class=\"l\">6. Devil half-mile<\/td><td>40m lines to 800m: 5 burpees per start-line crossing; broad jumps, TB overhead walk, bear crawl, lunges<\/td><td>Diary<\/td><\/tr><tr><td class=\"l\">7. Run back<\/td><td>2km easy <span class=\"sb\">the diary gives no distance<\/span><\/td><td>Diary / ADAPT<\/td><\/tr><\/table><p class=\"small\">Cadence: 3 seconds per rep. Operator Actual prescribes a \"3 sec Cadence\" without defining it; the booklet reads it as one rep every 3 seconds. Run it off a metronome app and use the same beat for every cadence session and test.<\/p>","log":"<div class=\"g2\"><div><table class=\"lg\"><tr><th class=\"l\">1000m<\/th><th>Time<\/th><\/tr><tr><td class=\"l\">1<\/td><td style=\"height:5.6mm\"><\/td><\/tr><tr><td class=\"l\">2<\/td><td style=\"height:5.6mm\"><\/td><\/tr><tr><td class=\"l\">3<\/td><td style=\"height:5.6mm\"><\/td><\/tr><tr><td class=\"l\">4<\/td><td style=\"height:5.6mm\"><\/td><\/tr><tr><td class=\"l\">5<\/td><td style=\"height:5.6mm\"><\/td><\/tr><tr><td class=\"l\">6<\/td><td style=\"height:5.6mm\"><\/td><\/tr><\/table><\/div><div><div class=\"flds c1\"><div class=\"fld\"><span>Pack march ><b>167<\/b><\/td><td><b>161<\/b><\/td><td><b>155<\/b><\/td><td><b>149<\/b><\/td><td><b>143<\/b><\/td><td><b>137<\/b><\/td><td><b>131<\/b><\/td><td><b>125<\/b><\/td><td><b>120<\/b><\/td><\/tr><\/table><p class=\"lgnote\">Selected rows of the SASR MAS table (30 sec / 120% column). Between rows: take the slower row, or work it out: 1600 / your 1600m seconds x 30 x 1.2.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>My 1600m time<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance (m)<\/span><i><\/i><\/div><\/div><table class=\"lg\"><tr><th class=\"l\">Set<\/th><th>Reps on time<\/th><th>Notes<\/th><\/tr><tr><td class=\"l\">Set 1<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><tr><td class=\"l\">Set 2<\/td><td style=\"height:6.2mm\"><\/td><td style=\"height:6.2mm\"><\/td><\/tr><\/table>"},"testDay":{"kind":"test","title":"TRG fitness test","src":"Perth","dress":"As instructed","inten":"Test","venue":"","plan":"TRG fitness test","body":"<p class=\"rx\">Standards as recorded for this program; check them against the joining instructions. The beep test (11.1) is not run in Perth.<\/p>","log":"<table class=\"lg\"><tr><th class=\"l\">Item<\/th><th>Standard<\/th><th>Result<\/th><th>Pass?<\/th><\/tr><tr><td class=\"l\">5km march, 20kg pack, walking<\/td><td>Under 40:00<\/td><td><\/td><td><\/td><\/tr><tr><td class=\"l\">Pull-ups in vest<\/td><td>3<\/td><td><\/td><td><\/td><\/tr><tr><td class=\"l\">Dead hang in vest<\/td><td>30 sec<\/td><td><\/td><td><\/td><\/tr><tr><td class=\"l\">Obstacle course incl. 75kg dummy drag<\/td><td>Under 4:00<\/td><td><\/td><td><\/td><\/tr><tr><td class=\"l\">Deadlift<\/td><td>75kg<\/td><td><\/td><td><\/td><\/tr><tr><td class=\"l\">Brick dive, boots and overalls<\/td><td>Complete<\/td><td><\/td><td><\/td><\/tr><tr><td class=\"l\">Tread water, boots and overalls<\/td><td>A couple of minutes<\/td><td><\/td><td><\/td><\/tr><tr><td class=\"l\">15m underwater swim<\/td><td>Complete<\/td><td><\/td><td><\/td><\/tr><tr><td class=\"l\">100m swim, boots and overalls<\/td><td>Under 4:00<\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"flds c1\"><div class=\"fld\"><span>What went well<\/span><i><\/i><\/div><div class=\"fld\"><span>Fix before the course<\/span><i><\/i><\/div><\/div>"},"gap":{"kind":"cardio","title":"Gap day: taper cardio, 30 min","src":"SASR 26.1","dress":"PT kit","inten":"RPE 7","venue":"","plan":"30 min low-impact cardio","body":"<p class=\"rx\">30 min low-impact cardio at RPE 7: bike, rower, elliptical or swim (SASR taper). Gap day before the course: D6 and D7 stay rest, and the last 2 days before the course are rest.<\/p>","log":"<div class=\"flds c2\"><div class=\"fld\"><span>Mode<\/span><i><\/i><\/div><div class=\"fld\"><span>Distance<\/span><i><\/i><\/div><div class=\"fld\"><span>Avg HR<\/span><i><\/i><\/div><div class=\"fld\"><span>How the legs feel<\/span><i><\/i><\/div><\/div>"},"ref":[{"t":"How the program works","h":"\n<h2>How the program works<\/h2>\n<p>Each 10-day roster cycle runs one SASR week: SASR's six sessions, plus two spare slots filled from the SF program (Phase A) or the 2026 diary (Phase B).\nOne session a day. Night 2 (D6) and the first day off (D7) are rest in every cycle. Where SASR schedules its own rest day, the booklet keeps it, so some cycles carry three.\nWork days fit the 45-60 min window; anything longer sits on D8-D10.\nGym days (D1 and D3) in Phase A loading cycles, and D1 in S1, S2, S4, S5 and S7, close with a 10-20 min Operator Actual finisher, which takes those sessions to about 55-70 min.\nD1 finishers stay off the legs and off running because D2 is an RPE 9 run. Heavy 5 x 3 cycles get low-impact cardio only; unload, test, reduce and taper cycles get none.<\/p>\n<table class=\"std\"><tr><th style=\"width:18mm\">Cycles<\/th><th style=\"width:22mm\">SASR weeks<\/th><th style=\"width:28mm\">Block<\/th><th>Content<\/th><\/tr><tr><td><b>A1-A6<\/b><\/td><td>1-6<\/td><td>Prep<\/td><td>3 x 10 to 5 x 3, 4 x 1600m ESD, packs 20-28kg to 15km. Baselines in A1.<\/td><\/tr><tr><td><b>A7-A10<\/b><\/td><td>7-10<\/td><td>Strength<\/td><td>Front squat / rack pull block, 3 x 1000-1200m intervals in the vest, packs 28-30kg. Test practice A9, MAS trial A10.<\/td><\/tr><tr><td><b>A11-A14<\/b><\/td><td>11-14<\/td><td>Strength endurance<\/td><td>Box squat / RDL block, MAS 30 intervals, timed marches 90 min-2 hours, open-water swims. Hold templates.<\/td><\/tr><tr><td><b>Holds<\/b><\/td><td>11-14 again<\/td><td>Hold<\/td><td>Fill the gap to Phase B. Run A11, A12, A13, A14 in order.<\/td><\/tr><tr><td><b>S1<\/b><\/td><td>15<\/td><td>Transition<\/td><td>9km vest run, forced march simulation, diary sessions start.<\/td><\/tr><tr><td><b>S2-S4<\/b><\/td><td>17, 18, 19<\/td><td>Strength<\/td><td>Heavy pack march, OA 10km run, Long Walk simulation, OA push-up ladder.<\/td><\/tr><tr><td><b>S5-S7<\/b><\/td><td>21, 22, 23<\/td><td>Strength endurance<\/td><td>6-hour marches (Long Walk, forced march), OA cadence push-ups and low-impact cardio, torsion bar circuits, jerry carries.<\/td><\/tr><tr><td><b>S8-S9<\/b><\/td><td>25, 26<\/td><td>Reduce, taper<\/td><td>Course Day 1 simulation, then the SASR taper into the course.<\/td><\/tr><\/table>\n<p class=\"small\" style=\"margin-top:1.4mm\">SASR Weeks 16, 20 and 24 are not used. <span class=\"ad\">ADAPT<\/span> Booklet choice: 26 cycles from a November start run to mid-July, past an early-course date. Week 16 repeats Week 15's transition pattern, Week 20 sits between two heavier weeks of the same block, and Week 24 repeats the Week 23 torsion bar layout.<\/p>\n<div class=\"g2\" style=\"margin-top:2mm\">\n<div><h3>Phase A slots<\/h3><table class=\"std \"><tr><th style=\"width:9mm\">Day<\/th><th style=\"width:25mm\">Shift / when<\/th><th>Slot<\/th><th style=\"width:23mm\">Source<\/th><\/tr><tr><td><b>D1<\/b><\/td><td><span class=\"chip DAY\">DAY<\/span><br><span class=\"small\">After shift<\/span><\/td><td>Strength 1 + OA finisher (upper, core or cardio)<\/td><td class=\"small\">SASR x.1, OA<\/td><\/tr><tr><td><b>D2<\/b><\/td><td><span class=\"chip DAY\">DAY<\/span><br><span class=\"small\">After shift<\/span><\/td><td>ESD / intervals / MAS<\/td><td class=\"small\">SASR x.2<\/td><\/tr><tr><td><b>D3<\/b><\/td><td><span class=\"chip ARVO\">ARVO<\/span><br><span class=\"small\">Morning, before 1400<\/span><\/td><td>Strength 2 + OA finisher<\/td><td class=\"small\">SASR x.3, OA<\/td><\/tr><tr><td><b>D4<\/b><\/td><td><span class=\"chip ARVO\">ARVO<\/span><br><span class=\"small\">Morning, before 1400<\/span><\/td><td>Swim + water skills<\/td><td class=\"small\">SF x.7, SASR pool GPP<\/td><\/tr><tr><td><b>D5<\/b><\/td><td><span class=\"chip NIGHT\">NIGHT<\/span><br><span class=\"small\">Afternoon, before 2100<\/span><\/td><td>GPP circuit<\/td><td class=\"small\">SASR x.5 / SF BW circuit<\/td><\/tr><tr><td><b>D6<\/b><\/td><td><span class=\"chip NIGHT\">NIGHT<\/span><br><span class=\"small\">Rest<\/span><\/td><td>REST<\/td><td class=\"small\">Your rule<\/td><\/tr><tr><td><b>D7<\/b><\/td><td><span class=\"chip OFF\">OFF<\/span><br><span class=\"small\">Rest<\/span><\/td><td>REST<\/td><td class=\"small\">Your rule<\/td><\/tr><tr><td><b>D8<\/b><\/td><td><span class=\"chip OFF\">OFF<\/span><br><span class=\"small\">Any time<\/span><\/td><td>Pack march (ELC)<\/td><td class=\"small\">SASR x.6<\/td><\/tr><tr><td><b>D9<\/b><\/td><td><span class=\"chip OFF\">OFF<\/span><br><span class=\"small\">Any time<\/span><\/td><td>Push-ups + heaves + Abs 1, then bear crawl<\/td><td class=\"small\">SF x.4 pm, Diary<\/td><\/tr><tr><td><b>D10<\/b><\/td><td><span class=\"chip OFF\">OFF<\/span><br><span class=\"small\">Any time<\/span><\/td><td>ESD / intervals / MAS<\/td><td class=\"small\">SASR x.4<\/td><\/tr><\/table><\/div>\n<div><h3>Phase B slots<\/h3><table class=\"std B\"><tr><th style=\"width:9mm\">Day<\/th><th style=\"width:25mm\">Shift / when<\/th><th>Slot<\/th><th style=\"width:23mm\">Source<\/th><\/tr><tr><td><b>D1<\/b><\/td><td><span class=\"chip DAY\">DAY<\/span><br><span class=\"small\">After shift<\/span><\/td><td>Strength 1 (+ OA finisher in S1, S2, S4, S5, S7)<\/td><td class=\"small\">SASR, OA<\/td><\/tr><tr><td><b>D2<\/b><\/td><td><span class=\"chip DAY\">DAY<\/span><br><span class=\"small\">After shift<\/span><\/td><td>Run / ESD / MAS<\/td><td class=\"small\">SASR<\/td><\/tr><tr><td><b>D3<\/b><\/td><td><span class=\"chip ARVO\">ARVO<\/span><br><span class=\"small\">Morning, before 1400<\/span><\/td><td>Strength 2<\/td><td class=\"small\">SASR<\/td><\/tr><tr><td><b>D4<\/b><\/td><td><span class=\"chip ARVO\">ARVO<\/span><br><span class=\"small\">Morning, before 1400<\/span><\/td><td>Diary session (water skills until the test)<\/td><td class=\"small\">Diary<\/td><\/tr><tr><td><b>D5<\/b><\/td><td><span class=\"chip NIGHT\">NIGHT<\/span><br><span class=\"small\">Afternoon, before 2100<\/span><\/td><td>GPP or diary session<\/td><td class=\"small\">SASR / Diary<\/td><\/tr><tr><td><b>D6<\/b><\/td><td><span class=\"chip NIGHT\">NIGHT<\/span><br><span class=\"small\">Rest<\/span><\/td><td>REST<\/td><td class=\"small\">Your rule<\/td><\/tr><tr><td><b>D7<\/b><\/td><td><span class=\"chip OFF\">OFF<\/span><br><span class=\"small\">Rest<\/span><\/td><td>REST<\/td><td class=\"small\">Your rule<\/td><\/tr><tr><td><b>D8<\/b><\/td><td><span class=\"chip OFF\">OFF<\/span><br><span class=\"small\">Any time<\/span><\/td><td>Long pack march, forced march or Long Walk<\/td><td class=\"small\">SASR / Diary<\/td><\/tr><tr><td><b>D9<\/b><\/td><td><span class=\"chip OFF\">OFF<\/span><br><span class=\"small\">Any time<\/span><\/td><td>OA push-up or cardio session, jerry carry or SASR rest<\/td><td class=\"small\">OA / Diary / SASR<\/td><\/tr><tr><td><b>D10<\/b><\/td><td><span class=\"chip OFF\">OFF<\/span><br><span class=\"small\">Any time<\/span><\/td><td>Run, diary session or SASR rest<\/td><td class=\"small\">SASR / Diary<\/td><\/tr><\/table><\/div>\n<\/div>\n<p class=\"small\" style=\"margin-top:2mm\">Cycle pages show the final layout. A few cycles move sessions around a test, a pool session or a SASR rest day; the plan page notes each move.\nTorsion bar sessions sit on work days (D1-D5) because the bar lives at the work gym.<\/p>\n"},{"t":"Rules, heart rate, dress and loads","h":"\n<h2>Rules<\/h2>\n<div class=\"g2\">\n<ul class=\"t\">\n<li><b>One session a day.<\/b> Overtime or court kills a session: drop it. Never stack it onto another day and never move it onto D6 or D7. Fresh: do not add sessions (SF, SASR).<\/li>\n<li>Not recovered from yesterday: take an extra rest day (SF, SASR).<\/li>\n<li>Injured: run an alternative session; never train through the injury (SF).<\/li>\n<li>Movement prep 5-10 min before every session. 2-3 warm-up sets before strength work sets (SASR).<\/li>\n<li>No strength set to failure: a set of 5 is 5 single, clean reps (SASR).<\/li>\n<li>Recovery after every session: foam roller, trigger point, stretching, cold water, massage (SASR). Warm-up stretches 3-5 sec, cool-down stretches 10-30 sec (SF).<\/li>\n<\/ul>\n<ul class=\"t\">\n<li>Drink before, during (every 15 min) and after every session. Eat within 30 min after (SF).<\/li>\n<li>Runners over boots wherever the session allows. Pack and vest work on grass, gravel or bush (SF).<\/li>\n<li>Long marches: in pairs where you can; leave your route and ETR with someone (SF).<\/li>\n<li>RHR every morning, 2 min after waking, at the same time. Use it to raise or lower the day's intensity (SF).<\/li>\n<li>Strength loads go up 2-5% where the bar moves well (SASR).<\/li>\n<li>Record every session. SASR: it shows progress and catches overtraining.<\/li>\n<\/ul>\n<\/div>\n<div class=\"g2\" style=\"margin-top:2mm\">\n<div>\n<h3>Heart rate<\/h3>\n<table class=\"std\"><tr><th style=\"width:44mm\">Anchor<\/th><th>% HRmax<\/th><th>bpm (HRmax <span class=\"hrmax\">187<\/span>)<\/th><\/tr>\n<tr><td>ESD and intervals: RPE 9<\/td><td>90%<\/td><td><span class=\"bpm\" data-p=\"90\">168<\/span><\/td><\/tr>\n<tr><td>GPP circuits: RPE 6-7<\/td><td>70-80%<\/td><td><span class=\"bpm\" data-p=\"70\">131<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span><\/td><\/tr>\n<tr><td>SF \"Low\"<\/td><td>40-60%<\/td><td><span class=\"bpm\" data-p=\"40\">75<\/span>-<span class=\"bpm\" data-p=\"60\">112<\/span><\/td><\/tr>\n<tr><td>SF \"Med\"<\/td><td>60-80%<\/td><td><span class=\"bpm\" data-p=\"60\">112<\/span>-<span class=\"bpm\" data-p=\"80\">150<\/span><\/td><\/tr>\n<tr><td>SF \"High\"<\/td><td>over 80%<\/td><td>over <span class=\"bpm\" data-p=\"80\">150<\/span><\/td><\/tr><\/table>\n<p class=\"small\" style=\"margin-top:1.4mm\">HRmax = 206.9 - (0.67 x age) = 206.9 - 20.1 = 186.8 at age 30 (SASR formula). SF uses 220 - age (190); the booklet uses the SASR figure for every zone.\nTraining HR (SF) = [% x (HRmax - RHR)] + RHR.<\/p>\n<p style=\"margin-top:1.4mm\">My RHR baseline: <span class=\"write\"><\/span> bpm. RHR up on your baseline: ease that day's intensity (SF gives no threshold).<\/p>\n<\/div>\n<div>\n<h3>RPE scale (SASR)<\/h3>\n<table class=\"std\"><tr><th style=\"width:9mm\">RPE<\/th><th style=\"width:28mm\">Feel<\/th><th>Example<\/th><\/tr><tr><td><b>1<\/b><\/td><td>Very easy<\/td><td>Active recovery<\/td><\/tr><tr><td><b>2<\/b><\/td><td>Easy<\/td><td>Endurance: long slow distance, walking<\/td><\/tr><tr><td><b>3<\/b><\/td><td>Moderate<\/td><td>Long steady aerobic<\/td><\/tr><tr><td><b>4<\/b><\/td><td>Tempo<\/td><td>Hiking moderate terrain<\/td><\/tr><tr><td><b>5<\/b><\/td><td>Hard<\/td><td>Strength endurance<\/td><\/tr><tr><td><b>6<\/b><\/td><td>Very hard<\/td><td>Threshold: 10-30 min intervals<\/td><\/tr><tr><td><b>7<\/b><\/td><td>VO2 max<\/td><td>3-8 min work intervals<\/td><\/tr><tr><td><b>8-9<\/b><\/td><td>Extremely difficult<\/td><td>Anaerobic capacity: 30 sec - 3 min max efforts<\/td><\/tr><tr><td><b>10<\/b><\/td><td>Max effort<\/td><td>Max lifts, sprints of 10 sec or less<\/td><\/tr><\/table>\n<\/div>\n<\/div>\n<h3>Dress and loads<\/h3>\n<table class=\"std\">\n<tr><th style=\"width:38mm\">Booklet code<\/th><th>Meaning<\/th><th style=\"width:60mm\">Replaces<\/th><\/tr>\n<tr><td><b>PT kit<\/b><\/td><td>Runners, shorts, shirt<\/td><td>SASR / SF PT<\/td><\/tr>\n<tr><td><b>Vest 9kg<\/b><\/td><td>Weighted vest, plates 3 + 3 + 3. Boots or runners as listed.<\/td><td>Webbing (SASR / SF PO). PO is 8kg; the plates build 7 or 9kg.<\/td><\/tr>\n<tr><td><b>Boots on rep 1<\/b><\/td><td>Rep 1 in boots, the rest in runners<\/td><td>SASR \"PO / boots\" (SASR's own boot rule)<\/td><\/tr>\n<tr><td><b>Overalls, runners<\/b><\/td><td>Overalls over PT kit, runners<\/td><td>SASR \"cams / runners\"<\/td><\/tr>\n<tr><td><b>Xkg pack, boots<\/b><\/td><td>The whole load in the pack; no vest<\/td><td>SASR MO (pack and webbing), SF FO<\/td><\/tr>\n<tr><td><b>Boots &amp; overalls<\/b><\/td><td>TRG water test dress<\/td><td>SF DPCUs; SASR cams + runners in the pool<\/td><\/tr>\n<tr><td><b>Overalls / swimmers<\/b><\/td><td>Pool dress as listed<\/td><td>SF DPCU shirt; SASR cams, cam pants<\/td><\/tr>\n<\/table>\n<p class=\"small\" style=\"margin-top:1.2mm\">Vest plates: 3 + 3 + 3 + 4kg build 3, 4, 6, 7, 9, 10 or 13kg. Phase B pack loads stop at 30kg <span class=\"ad\">ADAPT<\/span> SASR climbs to 45kg; the heaviest load in the 2026 diary was about 30kg.<\/p>\n"},{"t":"What the course asks for","h":"\n<h2>What the course asks for (2026 diary)<\/h2>\n<p>One candidate's account of the 2026 course: eight days, packs of about 21-30kg, hours of carrying, and torsion bar and burpee volume.\nThe left column is what the diary records; the right column shows where the booklet trains it. Course content changes year to year.<\/p>\n<table class=\"std\"><tr><th style=\"width:16mm\">Diary<\/th><th>Physical content<\/th><th style=\"width:70mm\">Trained by<\/th><\/tr><tr><td><b>Day 1<\/b><\/td><td>5 x 1000m, 2 min rest, 5:00 cut-off (diarist 3:40-4:15)<\/td><td>1000m repeats S1 D10; Course Day sim S8 D10; SASR ESD and MAS<\/td><\/tr><tr><td><b><\/b><\/td><td>1km pack marches, about 21kg; infil march, 25kg pack + 5kg bar<\/td><td>Every pack march; Course Day sim<\/td><\/tr><tr><td><b><\/b><\/td><td>Armageddon: torsion bar cadence curls to 150, cadence push-ups<\/td><td>S1 D5, S8 D4, Course Day sim; cadence push-ups S5 D9<\/td><\/tr><tr><td><b><\/b><\/td><td>Devil half-mile: burpees, broad jumps, TB overhead walk, bear crawl, lunges<\/td><td>S2 D4, S6 D4, Course Day sim; bear crawl after A2-A14 D9 push-ups<\/td><\/tr><tr><td><b>Day 2<\/b><\/td><td>Accumulator: push-ups, 20kg sandbag squats, sit-ups, max-cal bike<\/td><td>S6 D5<\/td><\/tr><tr><td><b><\/b><\/td><td>Jerry carry, 2 x 24L, 7-8 hours; then single bear-hug carry<\/td><td>S2 D9, S5 D4, S7 D9<\/td><\/tr><tr><td><b><\/b><\/td><td>Static holds: plank, side plank, bird dog, wall sit (2:00 on / 0:30 off)<\/td><td>S1 D5, S2 D9, S7 D9<\/td><\/tr><tr><td><b>Day 3<\/b><\/td><td>6 hours pack marching in pairs between lesson stations<\/td><td>6-hour marches S4-S7<\/td><\/tr><tr><td><b><\/b><\/td><td>Tyre flips, tyre carries, tyre roll 2.5km uphill<\/td><td>GPP 25-26 pack lifts (partial)<\/td><\/tr><tr><td><b>Day 4<\/b><\/td><td>Forced march, about 30kg: 5km in 40 min, then 1km per 10 min to 15km<\/td><td>First 5km of every Phase A march; S1 D8, S6 D8<\/td><\/tr><tr><td><b><\/b><\/td><td>Team stores carry, 25kg packs, about 4 hours<\/td><td>4-6 hour marches; jerry carries<\/td><\/tr><tr><td><b><\/b><\/td><td>Deck of cards, about 30 min<\/td><td>S7 D4<\/td><\/tr><tr><td><b>Day 5<\/b><\/td><td>Torsion bar laps (curls, thrusters, upright rows, press); pull-up ladder with burpee penalty<\/td><td>S4 D4<\/td><\/tr><tr><td><b><\/b><\/td><td>6-7 hours of team tasks moving under packs<\/td><td>Long marches<\/td><\/tr><tr><td><b>Day 6<\/b><\/td><td>The Long Walk: about 30kg, 500m hill loop all day, run to a station every 15 min<\/td><td>Long Walk sim S4 D8, S5 D8, S7 D8<\/td><\/tr><tr><td><b>Days 7-8<\/b><\/td><td>Policing scenarios, M4 assessment<\/td><td>Not physical<\/td><\/tr><\/table>\n<div class=\"g2\" style=\"margin-top:3mm\">\n<div class=\"box\"><h3>Patterns worth noting<\/h3><ul class=\"t\">\n<li>The course stacks events: runs, then marches, then circuits, in one block. Phase B puts diary sessions on the days after long marches for the same reason.<\/li>\n<li>Pack loads ran from about 21kg to 30kg. The forced march set a speed standard under load: 5km in 40 min at about 30kg.<\/li>\n<li>Grip and carrying ran for hours (jerry carry 7-8 hours).<\/li>\n<li>Cadence work punished breaks with planks. Pick one cadence and train to it every time.<\/li><\/ul><\/div>\n<div class=\"box\"><h3>Fitness test standards<\/h3><ul class=\"t\">\n<li>5km march, 20kg pack, under 40 min, walking only<\/li>\n<li>3 pull-ups + 30 sec dead hang in a vest<\/li>\n<li>Obstacle course under 4 min, with a 75kg dummy drag<\/li>\n<li>75kg deadlift<\/li>\n<li>Brick dive, then treading water a couple of minutes, boots and overalls<\/li>\n<li>15m underwater swim; 100m swim under 4 min in boots and overalls<\/li>\n<li>Beep test 11.1 is not run in Perth (obstacle course instead)<\/li><\/ul><\/div>\n<\/div>\n"},{"t":"Swaps and gaps","h":"\n<h2>Swaps and gaps<\/h2>\n<p>Every swap below appears on the sheets it affects with an <span class=\"ad\">ADAPT<\/span> tag. Kit the program was built around: home gym (rack, bar, plates, DBs to 40kg, cable, seated row / pulldown, leg press, bench, pull-up and dip bars, treadmill, rower, bike, elliptical), vest (13kg of plates), pack, weight belt; work gym kettlebells (to about 20kg) and torsion bar (about 12kg); a pool.<\/p>\n<table class=\"std\"><tr><th style=\"width:56mm\">Source item<\/th><th style=\"width:56mm\">Booklet<\/th><th>Why<\/th><\/tr><tr><td>Med ball slam, 7kg (SASR Str 1)<\/td><td><b>Explosive cable chop, high to low, 3 x 6<\/b><\/td><td class='small'>No med ball. Buy a 7kg slam ball and switch back.<\/td><\/tr><tr><td>GHD / Nordic raise (SASR Str 2)<\/td><td><b>Single-leg DB RDL, 3 x 12 each leg<\/b><\/td><td class='small'>No GHD or Nordic anchor<\/td><\/tr><tr><td>Tyre flip (SASR GPP 25-26)<\/td><td><b>20kg pack, floor to shoulder, x 10<\/b><\/td><td class='small'>No tyre; the diary also had teams lifting a tyre overhead<\/td><\/tr><tr><td>Webbing / PO 8kg (SASR, SF)<\/td><td><b>Vest 9kg<\/b><\/td><td class='small'>Plates build 7 or 9kg<\/td><\/tr><tr><td>Cams (SASR runs)<\/td><td><b>Overalls<\/b><\/td><td class='small'>TRG candidates wear overalls (diary)<\/td><\/tr><tr><td>MO / FO, pack + webbing<\/td><td><b>Pack at the full load, no vest<\/b><\/td><td class='small'>One load to manage; TRG test and course used packs<\/td><\/tr><tr><td>SASR pack loads over 30kg<\/td><td><b>30kg<\/b><\/td><td class='small'>Diary max about 30kg (25kg pack + 5kg bar; 30kg forced march and Long Walk)<\/td><\/tr><tr><td>Jerry cans, 2 x 24L (diary)<\/td><td><b>2 x 24kg DBs, or water-filled jerry cans<\/b><\/td><td class='small'>24L of water = 24kg<\/td><\/tr><tr><td>20kg sandbag (diary)<\/td><td><b>Pack loaded to 20kg<\/b><\/td><td class='small'>No sandbag<\/td><\/tr><tr><td>Stepper (SF machine circuit)<\/td><td><b>Elliptical<\/b><\/td><td class='small'>No stepper<\/td><\/tr><tr><td>Skipping (SF circuits)<\/td><td><b>Rope, or 1 min on the bike<\/b><\/td><td class='small'>Rope not on your kit list<\/td><\/tr><tr><td>SASR swim at the end of GPP 6, 11, 21<\/td><td><b>Rower 10 min<\/b><\/td><td class='small'>Those cycles already have a pool session<\/td><\/tr><tr><td>SASR 23.1 am swim (5 x 100m)<\/td><td><b>Dropped<\/b><\/td><td class='small'>One session a day<\/td><\/tr><tr><td>Assault bike calories (OA finishers)<\/td><td><b>10 cal on your bike, or 30 sec hard<\/b><\/td><td class='small'>No assault bike listed; your bike may not read calories<\/td><\/tr><tr><td>Stepper with 10-20kg at 70 steps/min (OA)<\/td><td><b>Vest 10-13kg incline treadmill walk, 20 min<\/b><\/td><td class='small'>No stepper<\/td><\/tr><tr><td>OA sled push / pull, ball slams, box jumps, muscle-ups<\/td><td><b>Not used<\/b><\/td><td class='small'>No sled, med ball or box<\/td><\/tr><tr><td>SF rope ascents, BFA, 3.2km trials<\/td><td><b>Not used<\/b><\/td><td class='small'>SF supplies swims, push-up / heave sets and circuits only<\/td><\/tr><\/table>\n<h3>Not trained<\/h3>\n<table class=\"std\"><tr><th style=\"width:90mm\">Item<\/th><th>Reason<\/th><\/tr><tr><td>Obstacle course and 75kg dummy drag (TRG test)<\/td><td class='small'>No drag kit or rope. Add a sled or drag strap and train it on GPP days.<\/td><\/tr><tr><td>Boxing, pad work, milling (diary Days 1, 3)<\/td><td class='small'>No pads or partner<\/td><\/tr><tr><td>300kg team box carry, team stores carry, tyre roll (diary Days 2-4)<\/td><td class='small'>Team events. The long marches and jerry carries build the base.<\/td><\/tr><tr><td>Burpees in respirators (diary Day 5)<\/td><td class='small'>No respirator<\/td><\/tr><tr><td>CS1 qual shoot, M4 assessment, scenarios, revision, peer ranking (diary)<\/td><td class='small'>Outside a physical program<\/td><\/tr><\/table>\n"},{"t":"MAS table","h":"\n<h2>MAS table (SASR)<\/h2>\n<p>Run the 1600m time trial (A10 D2), find your time, read across. SASR prescribes MAS 30 and MAS 15 sessions at <b>120%<\/b>: use the two shaded 120% columns.\nTimes between rows: take the slower row. Formula check: distance = 1600 / your seconds x interval seconds x 1.2.<\/p>\n<div class=\"g2\"><table class=\"mas\"><tr><th rowspan=2>1600m<\/th><th rowspan=2>sec<\/th><th rowspan=2>m/s<\/th><th colspan=3>15 sec<\/th><th colspan=3>30 sec<\/th><\/tr><tr><th>120%<\/th><th>125%<\/th><th>130%<\/th><th>110%<\/th><th>115%<\/th><th>120%<\/th><\/tr><tr><td>4:30<\/td><td>270<\/td><td>5.9<\/td><td>107<\/td><td>111<\/td><td>116<\/td><td>196<\/td><td>204<\/td><td>213<\/td><\/tr><tr><td>4:31<\/td><td>271<\/td><td>5.9<\/td><td>106<\/td><td>111<\/td><td>115<\/td><td>195<\/td><td>204<\/td><td>213<\/td><\/tr><tr><td>4:35<\/td><td>275<\/td><td>5.8<\/td><td>105<\/td><td>109<\/td><td>113<\/td><td>192<\/td><td>201<\/td><td>209<\/td><\/tr><tr><td>4:38<\/td><td>278<\/td><td>5.8<\/td><td>1 e (6:05 runner covers 151m in 30 sec) matches the 115% column; the program prescribes 120%, so the booklet uses 120%.<\/p>\n<div class=\"g2\" style=\"margin-top:2mm\">\n<div class=\"box\"><h3>Conduct (SASR)<\/h3><ul class=\"t\">\n<li>Cone your distance, ideally on a straight line or an AFL boundary.<\/li>\n<li>Run it in the interval time (30 or 15 sec), rest the same time in place, run back to the start cone.<\/li>\n<li>\"2 x 8\" = two sets of 8 reps; 3-4 min between sets. A set of 8 at 30 sec takes 8 min.<\/li><\/ul><\/div>\n<div class=\"box\"><h3>My numbers<\/h3>\n<p>1600m time (A10): <span class=\"write\" style=\"min-width:24mm\"><\/span><\/p>\n<p>MAS 30 / 120%: <span class=\"write\" style=\"min-width:20mm\"><\/span> m &nbsp; MAS 15 / 120%: <span class=\"write\" style=\"min-width:20mm\"><\/span> m<\/p>\n<p>Re-test (S3 week or before S5): <span class=\"write\" style=\"min-width:24mm\"><\/span><\/p><\/div>\n<\/div>\n"},{"t":"SF reference sessions","h":"\n<h2>SF reference sessions<\/h2>\n<h3>Body Weight Circuit (SF)<\/h3>\n<p class=\"small\">Aim: bodyweight fitness and all-over strength. Column 1 top to bottom, then columns 2-5 in the same order. Record total time.\nStruggling at first: 1 min rest after each skip until strength builds.<\/p>\n<table class=\"circ\"><tr><th>Exercise<\/th><th>1st<\/th><th>2nd<\/th><th>3rd<\/th><th>4th<\/th><th>5th<\/th><\/tr><tr><td>Overgrasp heaves<\/td><td>10<\/td><td>8<\/td><td>6<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>Push-ups<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td>Lying overgrasp heaves (inverted rows)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td>Full body dips<\/td><td>10<\/td><td>8<\/td><td>6<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>Weighted squats (20kg)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td>Weighted step-ups (10kg)<\/td><td>20<\/td><td>18<\/td><td>16<\/td><td>14<\/td><td>12<\/td><\/tr><tr><td>BFA sit-ups<\/td><td> async function wipeAll() {

      h("span", { class: "c", text: "D" + (p + 1) }), h("span", { class: "dt", text: sl.date ? String(+sl.date.slice(8)) : "·" }),
      h("span", { class: "mk" + (f ? "" : " r") + (done ? " on" : "") + (sl.moved && sl.ov == null ? " mv" : ""), style: f ? "--kc:var(--k-" + f[0] + ")" : null, text: f ? f[1] : "R" })));
